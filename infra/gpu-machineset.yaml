# TEMPLATE ONLY. Prefer: clone your own cluster's worker MachineSet (see docs/INSTALLATION.md / install.sh).
# Replace every <placeholder> (infra id, guid, uuid, AMI, AZ, subnet) for your cluster before applying.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: <infra-id>-gpu-us-east-1a
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: <infra-id>
  annotations:
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64
    machine.openshift.io/GPU: "1"
    machine.openshift.io/memoryMb: "32768"
    machine.openshift.io/vCPU: "8"
spec:
  replicas: 2
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: <infra-id>
      machine.openshift.io/cluster-api-machineset: <infra-id>-gpu-us-east-1a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: <infra-id>
        machine.openshift.io/cluster-api-machine-role: gpu-worker
        machine.openshift.io/cluster-api-machine-type: gpu-worker
        machine.openshift.io/cluster-api-machineset: <infra-id>-gpu-us-east-1a
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          node-role.kubernetes.io/gpu-worker: "true"
      providerSpec:
        value:
          ami:
            id: <ami-id>
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ""
              volumeSize: 200
              volumeType: gp3
          capacityReservationId: ""
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: <infra-id>-worker-profile
          instanceType: g6.2xlarge
          kind: AWSMachineProviderConfig
          metadata:
            creationTimestamp: null
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-1a
            region: us-east-1
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - <infra-id>-node
          - filters:
            - name: tag:Name
              values:
              - <infra-id>-lb
          subnet:
            filters:
            - name: tag:Name
              values:
              - <infra-id>-subnet-private-us-east-1a
          tags:
          - name: kubernetes.io/cluster/<infra-id>
            value: owned
          - name: Stack
            value: project openshift-cluster-<guid>
          - name: config
            value: openshift-cluster
          - name: guid
            value: <guid>
          - name: owner
            value: unknown
          - name: uuid
            value: <uuid>
          userDataSecret:
            name: worker-user-data
