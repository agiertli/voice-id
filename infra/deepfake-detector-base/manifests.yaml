---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepfake-detector-base
  namespace: voice-id
  labels:
    app: deepfake-detector-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepfake-detector-base
  template:
    metadata:
      labels:
        app: deepfake-detector-base
    spec:
      containers:
        - name: detector
          image: quay.io/agiertli/deepfake-detector-base:v1.0.3
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_DIR
              value: /app/models/wav2vec2-base
            - name: LOW_THRESHOLD
              value: "0.3"
            - name: HIGH_THRESHOLD
              value: "0.7"
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi  # 2Gi OOM-killed under sequential load (2026-11-24)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: deepfake-detector-base
  namespace: voice-id
  labels:
    app: deepfake-detector-base
spec:
  selector:
    app: deepfake-detector-base
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: deepfake-detector-base
  namespace: voice-id
spec:
  to:
    kind: Service
    name: deepfake-detector-base
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
