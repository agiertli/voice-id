# Gemma-4-12B (FP8, Red Hat validated) — "gemma" AI opponent (analyzes spectrogram images)
# FP8 weights ~13 GB -> fits a single NVIDIA L4 (24 GB, Ada supports FP8)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-model
  namespace: voice-id
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: gp3-csi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma
  namespace: voice-id
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: download
        image: registry.access.redhat.com/ubi9/python-312:latest
        command:
        - bash
        - -c
        - |
          pip install -q huggingface_hub && \
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              'RedHatAI/gemma-4-12B-it-FP8-dynamic',
              local_dir='/models/gemma-4-12b',
          )
          print('Download complete')
          "
        volumeMounts:
        - name: model
          mountPath: /models
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: gemma-model
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  name: gemma
  namespace: voice-id
spec:
  model:
    uri: pvc://gemma-model/gemma-4-12b
    name: gemma-4-12b
  replicas: 1
  template:
    containers:
      - name: main
        args:
          - --dtype=auto
          - --max-model-len=8192
          - --gpu-memory-utilization=0.90
          - --limit-mm-per-prompt.image=1
        resources:
          requests:
            cpu: "1"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
