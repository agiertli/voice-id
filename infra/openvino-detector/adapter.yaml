# serve.py-compatible adapters in front of the OVMS detectors (same /predict, /health, /ready API and JSON).
# The game calls them (Helm detectorBackend=openvino, the default and live backend since 2026-11-25):
#   DETECTOR_URL      = http://adapter-gary-finetuned.voice-id.svc.cluster.local:8080   (Gary 2.0)
#   DETECTOR_BASE_URL = http://adapter-gary-base.voice-id.svc.cluster.local:8080        (Gary)
# Everything runs in the game's namespace voice-id (install.sh rewrites it for --namespace).
# Code: apps/deepfake-detector/ovms_adapter/ (no model weights in the image).
# Image: public quay.io/agiertli/voice-id-ovms-adapter:v0.1.1 (pinned tag; UBI9-minimal, numpy/scipy).
# Build it yourself instead (optional): adapter-build.yaml (in-cluster BuildConfig), or
#   podman build --platform linux/amd64 -t <registry>/voice-id-ovms-adapter:<tag> apps/deepfake-detector/ovms_adapter
# and replace the image below.
#
# Length policy (must match the legacy images, see docs/OPENVINO-DETECTOR.md):
#   gary-finetuned = 160000 (current serve.py)    gary-base = native (older serve.py in deepfake-detector-base:v1.0.3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-gary-finetuned
  namespace: voice-id
  labels: {app: adapter-gary-finetuned, app.kubernetes.io/part-of: voice-id}
spec:
  replicas: 1
  selector:
    matchLabels: {app: adapter-gary-finetuned}
  template:
    metadata:
      labels: {app: adapter-gary-finetuned}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: adapter
        image: quay.io/agiertli/voice-id-ovms-adapter:v0.1.1
        env:
        # Headless predictor Service: DNS resolves to the pod IP, so call the pod port 8888 directly.
        # The ISVC status URL (port 80) does NOT work for in-cluster calls.
        - {name: OVMS_URL, value: "http://gary-finetuned-predictor.voice-id.svc.cluster.local:8888"}
        - {name: OVMS_MODEL, value: "gary-finetuned"}
        - {name: INPUT_LENGTH, value: "160000"}
        - {name: LOW_THRESHOLD, value: "0.3"}
        - {name: HIGH_THRESHOLD, value: "0.7"}
        ports:
        - {containerPort: 8080, name: http}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: adapter-gary-finetuned
  namespace: voice-id
  labels: {app: adapter-gary-finetuned}
spec:
  selector: {app: adapter-gary-finetuned}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-gary-base
  namespace: voice-id
  labels: {app: adapter-gary-base, app.kubernetes.io/part-of: voice-id}
spec:
  replicas: 1
  selector:
    matchLabels: {app: adapter-gary-base}
  template:
    metadata:
      labels: {app: adapter-gary-base}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: adapter
        image: quay.io/agiertli/voice-id-ovms-adapter:v0.1.1
        env:
        # Headless predictor Service: DNS resolves to the pod IP, so call the pod port 8888 directly.
        # The ISVC status URL (port 80) does NOT work for in-cluster calls.
        - {name: OVMS_URL, value: "http://gary-base-predictor.voice-id.svc.cluster.local:8888"}
        - {name: OVMS_MODEL, value: "gary-base"}
        - {name: INPUT_LENGTH, value: "native"}
        - {name: LOW_THRESHOLD, value: "0.3"}
        - {name: HIGH_THRESHOLD, value: "0.7"}
        ports:
        - {containerPort: 8080, name: http}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: adapter-gary-base
  namespace: voice-id
  labels: {app: adapter-gary-base}
spec:
  selector: {app: adapter-gary-base}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
