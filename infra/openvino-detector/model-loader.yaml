# Temporary pod used ONLY to copy the OpenVINO IR files (model.xml/model.bin) onto the PVCs.
# Delete it before (re)starting the predictors: gp3 PVCs are RWO.
#   oc apply -f infra/openvino-detector/model-loader.yaml
#   oc wait --for=condition=Ready pod/ovms-model-loader -n voice-id-ovms
#   oc cp ~/voice-id-audio/ovms/repo/gary-base      voice-id-ovms/ovms-model-loader:/models/gary-base-models/gary-base
#   oc cp ~/voice-id-audio/ovms/repo/gary-finetuned voice-id-ovms/ovms-model-loader:/models/gary-finetuned-models/gary-finetuned
#   oc delete pod ovms-model-loader -n voice-id-ovms
apiVersion: v1
kind: Pod
metadata:
  name: ovms-model-loader
  namespace: voice-id-ovms
spec:
  restartPolicy: Never
  containers:
  - name: loader
    image: registry.access.redhat.com/ubi9/ubi:latest  # needs tar for oc cp (ubi-minimal has none)
    command: ["sleep", "infinity"]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    volumeMounts:
    - {name: base, mountPath: /models/gary-base-models}
    - {name: ft, mountPath: /models/gary-finetuned-models}
  volumes:
  - name: base
    persistentVolumeClaim: {claimName: gary-base-models}
  - name: ft
    persistentVolumeClaim: {claimName: gary-finetuned-models}
