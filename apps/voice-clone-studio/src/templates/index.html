<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Clone Studio</title>
<!--
  Fonts: Red Hat Display / Red Hat Text, SIL Open Font License (static/fonts/OFL.txt), embedded locally (no CDN).
  Icons: Red Hat standard icons, CC BY 4.0, https://github.com/RedHat-UX/red-hat-icons (static/icons/ICON-LICENSE).
  Icon files are unmodified; they are tinted at runtime with CSS masks (one palette colour per icon).
  Colour meaning: teal #147878 = human (your own recordings), purple #5e40be = AI (generated clips, TTS models).
-->
<style>
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

:root {
    --rh-red: #ee0000;
    --rh-red-dark: #a60000;
    --bg: #ffffff;
    --surface: #f2f2f2;
    --border: #c7c7c7;
    --divider: #e0e0e0;
    --text: #151515;
    --text-muted: #4d4d4d;
    --ai: #5e40be;
    --human: #147878;
    --radius: 12px;
    --header-h: 68px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 18px; }
@media (max-width: 600px) { html { font-size: 16px; } }

body {
    font-family: 'Red Hat Text', system-ui, sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, .display { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; line-height: 1.2; }
button, input, textarea, select { font-family: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- Icons (Red Hat standard icons via CSS mask) ---------- */
.ico {
    display: inline-block; width: 1em; height: 1em; flex: none;
    background-color: currentColor;
    -webkit-mask: var(--ico) center / contain no-repeat;
            mask: var(--ico) center / contain no-repeat;
    vertical-align: middle;
}
.ico-user { --ico: url('/static/icons/user.svg'); }
.ico-ai { --ico: url('/static/icons/ai-chatbot-happy.svg'); }
.ico-checklist { --ico: url('/static/icons/clipboard-checklist.svg'); }
.ico-conversation { --ico: url('/static/icons/conversation.svg'); }
/* Small UI glyphs (play, pause, arrows) */
svg.glyph { width: 1em; height: 1em; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
svg.glyph.fill { fill: currentColor; stroke: none; }

/* ---------- Header ---------- */
.app-header {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    background: var(--bg);
    border-bottom: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.2rem; gap: 0.8rem;
}
.brand { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
.brand-logo img { display: block; height: 46px; width: auto; }
.brand-sep { width: 1px; height: 36px; background: var(--divider); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.app-title { font-size: 1.25rem; white-space: nowrap; }
.app-subtitle { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex: none; }
.lang-btn {
    min-width: 48px; min-height: 48px; border: none; background: var(--bg);
    font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--text-muted);
}
.lang-btn + .lang-btn { border-left: 1px solid var(--divider); }
.lang-btn.active { background: var(--text); color: #fff; }
@media (max-width: 600px) {
    .app-header { padding: 0 0.6rem; }
    .brand { gap: 0.5rem; }
    .brand-logo img { height: 42px; }
    .brand-sep, .app-subtitle { display: none; }
    .app-title { font-size: 1.1rem; }
    .lang-btn { min-width: 42px; }
}

/* ---------- Layout ---------- */
.container { max-width: 1160px; margin: 0 auto; padding: 1.2rem 1.4rem 3rem; }
.screen { display: none; animation: fadeIn 0.25s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 600px) { .container { padding: 0.9rem 0.9rem 2.5rem; } }

/* ---------- Toast ---------- */
.toast {
    position: fixed; top: calc(var(--header-h) + 0.6rem); left: 50%;
    transform: translateX(-50%) translateY(-12px); opacity: 0; pointer-events: none;
    background: var(--text); color: #fff;
    border-radius: var(--radius); padding: 0.8rem 1.4rem;
    font-size: 0.95rem; font-weight: 700; z-index: 1000;
    transition: transform 0.2s ease, opacity 0.2s ease;
    max-width: 90vw; text-align: center;
}
.toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ---------- Buttons ---------- */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    min-height: 56px; padding: 0 1.6rem;
    border-radius: var(--radius); border: 2px solid transparent;
    font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.1rem;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.08s;
    line-height: 1.2; text-decoration: none;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { cursor: not-allowed; opacity: 0.45; }
.btn-primary { background: var(--rh-red); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--rh-red-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border-color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--surface); }
.btn-ghost { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--text); }
.btn-sm { min-height: 48px; font-size: 1rem; padding: 0 1.1rem; }
.btn .ico { width: 26px; height: 26px; }

/* ---------- Step labels ---------- */
.step-label {
    display: flex; align-items: center; gap: 0.55rem;
    font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.05rem;
    margin-bottom: 0.55rem;
}
.step-num {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--text); color: #fff; font-size: 0.85rem;
}

/* ---------- Setup row (name + mode) ---------- */
.setup { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 1.4rem; align-items: start; }
@media (max-width: 860px) { .setup { grid-template-columns: 1fr; gap: 1rem; } }
.name-input {
    width: 100%; min-height: 60px; padding: 0 1.1rem;
    border: 2px solid var(--border); border-radius: var(--radius);
    font-size: 1.15rem; background: var(--bg); outline: none;
}
.name-input:focus { border-color: var(--text); }
.name-input::placeholder { color: var(--text-muted); }
.name-input:disabled { background: var(--surface); color: var(--text-muted); }

.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
.mode-card {
    display: flex; align-items: flex-start; gap: 0.75rem; text-align: left;
    min-height: 60px; padding: 0.8rem 1rem;
    background: var(--surface); border: 2px solid var(--surface); border-radius: var(--radius);
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.mode-card:hover { border-color: var(--border); }
.mode-card.active { background: var(--bg); border-color: var(--text); }
.mode-card .ico { width: 36px; height: 36px; color: var(--text-muted); margin-top: 0.1rem; }
.mode-card.active .ico { color: var(--text); }
.mode-text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.mode-title { font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.mode-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.35; }
@media (max-width: 600px) {
    .mode-card { align-items: center; padding: 0.7rem 0.8rem; gap: 0.55rem; }
    .mode-card .ico { width: 30px; height: 30px; margin: 0; }
    .mode-desc { display: none; }
    .mode-title { font-size: 1rem; }
}

/* ---------- Step 3 header: what to do next + recording language ---------- */
.work-head {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 0.3rem 1.4rem; margin-top: 1.3rem; padding-top: 1.1rem; border-top: 1px solid var(--divider);
}
.work-head .step-label { margin-bottom: 0; }
.mode-hint { grid-column: 1 / -1; color: var(--text-muted); font-size: 0.95rem; line-height: 1.4; }
@media (max-width: 860px) {
    .work-head { grid-template-columns: 1fr; gap: 0.6rem; }
    .work-head .rec-lang { order: 3; }
}
.rec-lang { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.rec-lang-label { font-weight: 700; font-size: 0.95rem; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg-btn {
    min-height: 48px; padding: 0 1rem; border: none; background: var(--bg);
    font-weight: 700; font-size: 0.95rem; cursor: pointer; color: var(--text-muted);
}
.seg-btn + .seg-btn { border-left: 1px solid var(--divider); }
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--text); color: #fff; }
@media (max-width: 600px) {
    .rec-lang { width: 100%; }
    .rec-lang .seg { width: 100%; }
    .rec-lang .seg-btn { flex: 1; padding: 0 0.4rem; font-size: 0.9rem; }
}

/* ---------- Clone mode ---------- */
.clone-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1.2rem; margin-top: 1rem; align-items: stretch; }
@media (max-width: 960px) { .clone-grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem 1.4rem; }
.card-label { font-weight: 700; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.45rem; }
.prompt-text {
    font-family: 'Red Hat Text', sans-serif; font-weight: 400;
    font-size: 1.32rem; line-height: 1.5; color: var(--text);
}
@media (max-width: 600px) { .prompt-text { font-size: 1.22rem; } }
.prompt-actions { display: flex; justify-content: flex-end; margin-top: 0.6rem; }
.link-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    min-height: 44px; padding: 0 0.6rem; border: none; background: none; cursor: pointer;
    font-weight: 700; font-size: 0.95rem; color: var(--text); text-decoration: underline; text-underline-offset: 3px;
}
.link-btn:hover { color: var(--rh-red-dark); }

.rec-panel {
    border: 1px solid var(--divider); border-radius: var(--radius);
    padding: 1.4rem 1.2rem; display: flex; flex-direction: column; justify-content: center;
}
.record-area, .review-area { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; text-align: center; }
.review-area { display: none; }
.review-area.visible { display: flex; }

.record-hint { font-size: 1rem; color: var(--text-muted); line-height: 1.4; max-width: 22rem; }
.record-btn {
    width: 104px; height: 104px; border-radius: 50%;
    border: 5px solid var(--rh-red); background: var(--bg); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
}
.record-btn:hover { background: var(--surface); }
.record-btn:active { transform: scale(0.96); }
.record-btn .inner { width: 52px; height: 52px; border-radius: 50%; background: var(--rh-red); transition: all 0.2s; }
.record-btn.recording .inner { width: 36px; height: 36px; border-radius: 6px; }
.record-btn.recording { animation: pulse-ring 1.5s ease-in-out infinite; }
@keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(238, 0, 0, 0.35); }
    50% { box-shadow: 0 0 0 14px rgba(238, 0, 0, 0); }
}
.record-timer {
    font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.5rem;
    color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.record-timer.active { color: var(--rh-red-dark); }

/* Narrow screens: the record control is a sticky bottom bar, reachable while reading. */
@media (max-width: 960px) {
    .rec-panel {
        position: sticky; bottom: 0; z-index: 20;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0; padding: 0.7rem 1rem;
    }
    .record-area {
        display: grid; grid-template-columns: auto 1fr; column-gap: 1rem; row-gap: 0.15rem;
        grid-template-areas: "btn hint" "btn timer"; align-items: center; text-align: left;
    }
    .record-area .record-hint { grid-area: hint; align-self: end; font-size: 0.95rem; }
    .record-area .record-btn { grid-area: btn; width: 80px; height: 80px; }
    .record-area .record-btn .inner { width: 40px; height: 40px; }
    .record-area .record-btn.recording .inner { width: 28px; height: 28px; }
    .record-area .record-timer { grid-area: timer; align-self: start; font-size: 1.3rem; }
    .review-area { gap: 0.6rem; }
    .review-play-btn { width: 60px; height: 60px; }
}
.review-area .card-label { color: var(--human); margin: 0; font-size: 1.05rem; }
.review-area .card-label .ico { width: 30px; height: 30px; }
.review-play-btn {
    width: 72px; height: 72px; border-radius: 50%; border: none;
    background: var(--human); color: #fff; font-size: 1.6rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.review-play-btn:hover { filter: brightness(0.9); }
.review-duration { font-size: 0.95rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.review-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; }

.existing { margin-top: 1.6rem; }
.section-heading {
    font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.15rem;
    margin: 1.6rem 0 0.7rem; display: flex; align-items: center; gap: 0.5rem;
}
.section-heading .ico { width: 30px; height: 30px; }
.existing .section-heading { margin-top: 0; }
.voice-picker { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.voice-chip { justify-content: flex-start; }
.voice-chip .ico { color: var(--human); }

/* ---------- Sentence mode ---------- */
.sent-progress { color: var(--text-muted); font-size: 1rem; margin: 1rem 0 0.7rem; }
.sent-progress b { color: var(--human); }
.sent-list { display: flex; flex-direction: column; gap: 0.5rem; }
.sent-item {
    background: var(--surface); border: 2px solid var(--surface); border-radius: var(--radius);
    padding: 0.75rem 0.9rem; cursor: pointer; transition: border-color 0.15s;
}
.sent-item:hover { border-color: var(--border); }
.sent-item.active { background: var(--bg); border-color: var(--text); cursor: default; }
.sent-row { display: flex; align-items: center; gap: 0.7rem; }
.sent-num { color: var(--text-muted); font-weight: 700; min-width: 1.8rem; font-variant-numeric: tabular-nums; }
.sent-text { flex: 1; line-height: 1.45; font-size: 1.05rem; }
.sent-item.active .sent-text { font-size: 1.3rem; }
.sent-status { color: var(--human); font-weight: 700; font-size: 0.9rem; white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 0.25rem; }
.sent-play {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    border: 2px solid var(--human); background: var(--bg); color: var(--human);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
}
.sent-play:hover { background: var(--surface); }
.sent-panel { display: none; margin-top: 0.9rem; text-align: center; }
.sent-item.active .sent-panel { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
.sent-panel .record-btn { width: 88px; height: 88px; }
.sent-panel .record-btn .inner { width: 44px; height: 44px; }
.sent-panel .record-btn.recording .inner { width: 30px; height: 30px; }
.sent-error {
    max-width: 34rem; padding: 0.7rem 0.9rem; border: 1px solid var(--rh-red-dark); border-radius: var(--radius);
    color: var(--rh-red-dark); background: var(--bg); text-align: left; line-height: 1.4;
}
.sent-error b { display: block; }

/* ---------- Generate screen ---------- */
.gen-wrap { max-width: 820px; margin: 0 auto; }
.voice-card { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem 1.2rem; }
.voice-badge { display: flex; align-items: center; gap: 0.7rem; flex: 1; min-width: 200px; }
.voice-badge .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--human); color: var(--human); background: var(--bg);
}
.voice-badge .avatar .ico { width: 32px; height: 32px; }
.voice-badge-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.voice-badge-label { font-size: 0.85rem; color: var(--human); font-weight: 700; }
#voice-name { font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 1.35rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.voice-action-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.voice-action-row .btn { min-height: 44px; padding: 0 0.8rem; font-size: 0.92rem; gap: 0.4rem; border-width: 1px; }
.voice-action-row .btn .ico { width: 22px; height: 22px; }
.btn-danger-text { color: var(--rh-red-dark); }
@media (max-width: 600px) {
    .voice-action-row { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .voice-action-row .btn { justify-content: flex-start; padding: 0 0.6rem; }
    .clip-card { gap: 0.6rem; padding: 0.7rem; }
    .clip-actions { flex-direction: column; }
}

.gen-heading { font-size: 1.5rem; margin: 1.6rem 0 0.7rem; }
.text-area {
    width: 100%; padding: 0.9rem 1rem; border: 2px solid var(--border); border-radius: var(--radius);
    font-size: 1.15rem; line-height: 1.45; background: var(--bg); outline: none; resize: vertical;
}
.text-area:focus { border-color: var(--text); }
.text-area::placeholder { color: var(--text-muted); }
.generate-row { display: flex; gap: 0.7rem; margin-top: 0.8rem; align-items: stretch; }
.select-wrap { position: relative; flex: 1; }
.select-wrap select {
    width: 100%; height: 100%; min-height: 56px; appearance: none; -webkit-appearance: none;
    padding: 0 2.6rem 0 1rem; border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--bg); font-size: 1.05rem; font-weight: 700; color: var(--ai); cursor: pointer; outline: none;
}
.select-wrap select:focus { border-color: var(--text); }
.select-wrap::after {
    content: ''; position: absolute; right: 1.1rem; top: 50%; width: 9px; height: 9px; margin-top: -7px;
    border-right: 2px solid var(--text); border-bottom: 2px solid var(--text); transform: rotate(45deg); pointer-events: none;
}
.generate-row .btn { flex: 1; }
@media (max-width: 600px) { .generate-row { flex-direction: column; } }

.spinner-overlay { display: none; flex-direction: column; align-items: center; gap: 0.8rem; margin-top: 1.4rem; }
.spinner-overlay.visible { display: flex; }
.spinner { width: 48px; height: 48px; border: 4px solid var(--divider); border-top-color: var(--ai); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-text { color: var(--text-muted); font-size: 0.95rem; text-align: center; line-height: 1.5; }
.spinner-elapsed { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ai); }

.section-heading.ai { color: var(--ai); }
.clips-list { display: flex; flex-direction: column; gap: 0.6rem; }
.clip-card {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.8rem 0.9rem; border: 1px solid var(--divider); border-left: 4px solid var(--ai);
    border-radius: var(--radius); background: var(--bg);
}
.clip-play-btn {
    width: 52px; height: 52px; min-width: 52px; border-radius: 50%; border: none;
    background: var(--ai); color: #fff; font-size: 1.15rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.clip-play-btn:hover, .clip-play-btn.playing { filter: brightness(0.85); }
.clip-info { flex: 1; min-width: 0; }
.clip-text {
    font-size: 1rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.clip-meta-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; }
.provider-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.8rem; font-weight: 700; padding: 0.15rem 0.6rem 0.15rem 0.4rem;
    border: 1px solid var(--ai); border-radius: 999px; color: var(--ai);
}
.provider-badge .ico { width: 18px; height: 18px; }
.clip-actions { display: flex; gap: 0.2rem; }
.clip-action-btn {
    width: 44px; height: 44px; border: none; background: none; border-radius: 50%;
    color: var(--text-muted); cursor: pointer; font-size: 1.1rem;
    display: inline-flex; align-items: center; justify-content: center;
}
.clip-action-btn:hover { background: var(--surface); color: var(--text); }
.clip-action-btn.delete:hover { color: var(--rh-red-dark); }

.back-link {
    display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 1.8rem;
    min-height: 48px; padding: 0 0.4rem; border: none; background: none; cursor: pointer;
    font-weight: 700; font-size: 1rem; color: var(--text); text-decoration: underline; text-underline-offset: 3px;
}
.back-link:hover { color: var(--rh-red-dark); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="g-play" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></symbol>
        <symbol id="g-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16"/><rect x="14" y="4" width="4.5" height="16"/></symbol>
        <symbol id="g-download" viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="15"/><polyline points="7,10 12,15 17,10"/><line x1="5" y1="20" x2="19" y2="20"/></symbol>
        <symbol id="g-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20,4 20,9 15,9"/></symbol>
        <symbol id="g-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
        <symbol id="g-back" viewBox="0 0 24 24"><line x1="20" y1="12" x2="5" y2="12"/><polyline points="11,6 5,12 11,18"/></symbol>
        <symbol id="g-check" viewBox="0 0 24 24"><polyline points="5,12.5 10,17.5 19,7"/></symbol>
    </defs>
</svg>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="app-header">
    <div class="brand" id="hdr-brand" role="button" tabindex="0" title="Home" style="cursor:pointer">
        <picture class="brand-logo">
            <source media="(max-width: 600px)" srcset="/static/logo-light-mark.png">
            <img src="/static/logo-light-compact.png" alt="Voice ID: AI or Alive?">
        </picture>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-text">
            <h1 class="app-title">Voice Clone Studio</h1>
            <span class="app-subtitle" id="app-subtitle">Klonujte svůj hlas pomocí AI</span>
        </span>
    </div>
    <div class="lang-switch" id="lang-toggle" role="group" aria-label="Page language">
        <button class="lang-btn" data-lang="en" type="button" title="English">EN</button>
        <button class="lang-btn active" data-lang="cs" type="button" title="Čeština">CS</button>
        <button class="lang-btn" data-lang="sk" type="button" title="Slovenčina">SK</button>
    </div>
</header>

<main class="container">

    <!-- ========== SCREEN: RECORD ========== -->
    <section id="screen-record" class="screen active">

        <div class="setup">
            <div>
                <label class="step-label" for="speaker-name"><span class="step-num">1</span><span id="step-name-label">Vaše jméno</span></label>
                <input type="text" class="name-input" id="speaker-name" placeholder="Zadejte své jméno" maxlength="30" autocomplete="off">
            </div>
            <div>
                <div class="step-label"><span class="step-num">2</span><span id="step-mode-label">Co chcete udělat?</span></div>
                <div class="mode-cards" id="mode-toggle" role="group">
                    <button class="mode-card active" type="button" data-mode="clone" id="mode-btn-clone">
                        <span class="ico ico-ai" aria-hidden="true"></span>
                        <span class="mode-text">
                            <span class="mode-title" id="mode-title-clone">Klonovat hlas</span>
                            <span class="mode-desc" id="mode-desc-clone"></span>
                        </span>
                    </button>
                    <button class="mode-card" type="button" data-mode="sentences" id="mode-btn-sentences">
                        <span class="ico ico-checklist" aria-hidden="true"></span>
                        <span class="mode-text">
                            <span class="mode-title" id="mode-title-sentences">Nahrát věty</span>
                            <span class="mode-desc" id="mode-desc-sentences"></span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <div class="work-head">
            <div class="step-label"><span class="step-num">3</span><span id="step-work-label"></span></div>
            <div class="rec-lang">
                <span class="rec-lang-label" id="rec-lang-label">Jazyk nahrávky:</span>
                <div class="seg" id="rec-lang-toggle" role="group">
                    <button class="seg-btn active" type="button" data-slang="cs" lang="cs">Čeština</button>
                    <button class="seg-btn" type="button" data-slang="sk" lang="sk">Slovenčina</button>
                    <button class="seg-btn" type="button" data-slang="en" lang="en">English</button>
                </div>
            </div>
            <div class="mode-hint" id="mode-hint"></div>
        </div>

        <div id="mode-clone">
            <div class="clone-grid">
                <div class="card" id="prompt-card">
                    <div class="card-label" id="prompt-label">Přečtěte nahlas</div>
                    <p class="prompt-text" id="prompt-text">Načítám text...</p>
                    <div class="prompt-actions">
                        <button class="link-btn" id="btn-refresh-prompt" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-refresh"/></svg><span id="refresh-label">Jiný text</span></button>
                    </div>
                </div>

                <div class="rec-panel">
                    <div class="record-area" id="record-area">
                        <div class="record-hint" id="record-hint">Stiskněte pro zahájení nahrávání</div>
                        <button class="record-btn" id="btn-record" type="button" aria-label="Record"><div class="inner"></div></button>
                        <div class="record-timer" id="record-timer">0:00 / 0:30</div>
                    </div>

                    <div class="review-area" id="review-area">
                        <div class="card-label"><span class="ico ico-user" aria-hidden="true"></span><span id="review-label">Vaše nahrávka</span></div>
                        <button class="review-play-btn" id="btn-review-play" type="button" aria-label="Play"></button>
                        <div class="review-duration" id="review-duration"></div>
                        <div class="record-hint" id="review-hint"></div>
                        <div class="review-actions">
                            <button class="btn btn-secondary btn-sm" id="btn-rerecord" type="button">Znovu nahrát</button>
                            <button class="btn btn-primary btn-sm" id="btn-save-voice" type="button" disabled>Uložit a pokračovat</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="existing" id="existing-voices-section" style="display:none;">
                <div class="section-heading"><span class="ico ico-user" style="color:var(--human)" aria-hidden="true"></span><span id="existing-voices-heading">Existující hlasy</span></div>
                <div class="voice-picker" id="voice-picker-list"></div>
            </div>
        </div><!-- /mode-clone -->

        <div id="mode-sentences" style="display:none;">
            <div class="sent-progress" id="sent-progress"></div>
            <div class="sent-list" id="sent-list"></div>
        </div>
    </section>

    <!-- ========== SCREEN: GENERATE ========== -->
    <section id="screen-generate" class="screen">
        <div class="gen-wrap">
            <div class="card voice-card">
                <div class="voice-badge" id="voice-badge">
                    <span class="avatar"><span class="ico ico-user" aria-hidden="true"></span></span>
                    <span class="voice-badge-text">
                        <span class="voice-badge-label" id="voice-badge-label">Váš hlas</span>
                        <span id="voice-name">—</span>
                    </span>
                </div>
                <div class="voice-action-row">
                    <button class="btn btn-ghost" id="btn-play-voice" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-play"/></svg><span id="play-voice-label">Přehrát nahrávku</span></button>
                    <button class="btn btn-ghost" id="btn-download-voice" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-download"/></svg><span id="download-voice-label">Stáhnout nahrávku</span></button>
                    <button class="btn btn-ghost" id="btn-rerecord-voice" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-refresh"/></svg><span id="rerecord-label">Přenahrát hlas</span></button>
                    <button class="btn btn-ghost" id="btn-voice-sentences" type="button"><span class="ico ico-checklist" aria-hidden="true"></span><span id="voice-sentences-label">Nahrát věty</span></button>
                    <button class="btn btn-ghost btn-danger-text" id="btn-delete-voice" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-close"/></svg><span id="delete-voice-label">Smazat hlas</span></button>
                </div>
            </div>

            <h2 class="gen-heading" id="gen-heading">Co má AI říct vaším hlasem?</h2>
            <textarea class="text-area" id="gen-text" rows="3" placeholder="Napište text ke generování...">Umělá inteligence mění způsob, jakým vyvíjíme software a automatizujeme procesy.</textarea>

            <div class="generate-row">
                <div class="select-wrap">
                    <select id="gen-provider" aria-label="TTS model"></select>
                </div>
                <button class="btn btn-primary" id="btn-generate" type="button">Generovat</button>
            </div>

            <div class="spinner-overlay" id="gen-spinner">
                <div class="spinner"></div>
                <div class="spinner-text">
                    <span id="spinner-msg">Generuji... může to trvat až 2 minuty</span><br>
                    <span class="spinner-elapsed" id="gen-elapsed">0:00</span>
                </div>
            </div>

            <div class="section-heading ai" id="clips-heading-wrap" style="display:none;"><span class="ico ico-ai" aria-hidden="true"></span><span id="clips-heading">Vygenerované klipy</span></div>
            <div class="clips-list" id="clips-list"></div>

            <button class="back-link" id="btn-back-record" type="button"><svg class="glyph" aria-hidden="true"><use href="#g-back"/></svg><span id="back-record-label">Nahrát nový hlas</span></button>
        </div>
    </section>

</main>

    var recLang = currentLang;

    var $ = function(id) { return document.getElementById(id); };

    // --- Toast ---
    var toastTimer = null;
    function showToast(msg, duration) {
        duration = duration || 4000;
        var el = $('toast');
        el.textContent = msg;
        el.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { el.classList.remove('visible'); }, duration);
    }

    // --- Screen ---
    var navFromHistory = false;
    function showScreen(id) {
        var prev = document.querySelector('.screen.active');
        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
        $(id).classList.add('active');
        window.scrollTo(0, 0);
        // Browser Back follows the app's screens (like the Voice ID game) and never leaves the app.
        if (!navFromHistory && (!prev || prev.id !== id)) {
            try { history.pushState({ vcs: id, voice: currentVoiceId, name: currentVoiceName }, ''); } catch (e) {}
        }
    }
    function goHome() {
        if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
        if (typeof stopSentenceRecording === 'function' && sentRecorder && sentRecorder.state === 'recording') stopSentenceRecording();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        $('btn-back-record').click();
    }

    function applyModeTexts() {
        var clone = currentMode === 'clone';

        $('mode-hint').textContent = t(clone ? 'modeCloneHint' : 'modeSentencesHint');

    function switchLang(lang) {
        currentLang = lang;
        applyLang();
        setRecLang(lang);   // recording language follows the page language by default
    }

    function setRecLang(lang) {
        if (sentRecorder && sentRecorder.state === 'recording') stopSentenceRecording();
        if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
        recLang = lang;
        sentActive = null;
        sentBlob = null;
        sentError = null;
        document.querySelectorAll('#rec-lang-toggle .seg-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.slang === lang);
        });
        loadPrompts();
        if (currentMode === 'sentences') loadSentences();
    }

    // --- API helpers ---
    async function api(path, opts) {
        opts = opts || {};
        try {
            var resp = await fetch(path, opts);
            if (!resp.ok) {
                var body = await resp.text();
                var msg;
                try { msg = JSON.parse(body).error; } catch(_) { msg = body; }
                throw new Error(msg || ('HTTP ' + resp.status));
            }
            return resp;
        } catch (err) {
            if (err.name === 'AbortError') throw err;
            showToast(t('errorPrefix') + err.message);
            throw err;
        }
    }

    // --- Prompts ---
    async function loadPrompts() {
        try {
            var resp = await api('/api/prompts?lang=' + recLang);
            prompts = await resp.json();
            showRandomPrompt();
        } catch(_) {
            $('prompt-text').textContent = 'Red Hat OpenShift simplifies application deployment in hybrid cloud.';
        }
    }

    function showRandomPrompt() {
        if (!prompts.length) return;
        var p = prompts[Math.floor(Math.random() * prompts.length)];
        $('prompt-text').textContent = p;
    }

    // --- Providers ---
    async function loadProviders() {
        try {
            var resp = await api('/api/providers');
            providers = await resp.json();
            var sel = $('gen-provider');
            sel.innerHTML = '';
            providers.forEach(function(p) {
                var opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                sel.appendChild(opt);
            });
        } catch(_) {}
    }

    // --- Recording ---
    function formatTime(sec) {
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return m + ':' + String(s).padStart(2, '0');
    }

    async function startRecording() {
        var name = $('speaker-name').value.trim();
        if (!name) {
            showToast(t('nameRequired'));
            $('speaker-name').focus();
            return;
        }

        try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recordedChunks = [];
            recordedBlob = null;
            recordingSeconds = 0;

            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = function() {
                stream.getTracks().forEach(function(t) { t.stop(); });
                recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                showReview();
            };

            mediaRecorder.start(250);

            $('btn-record').classList.add('recording');
            $('record-hint').textContent = t('recording');
            $('record-timer').classList.add('active');
            $('review-area').classList.remove('visible');
            updateRecordTimer();

            recordingTimer = setInterval(function() {
                recordingSeconds++;
                updateRecordTimer();
                if (recordingSeconds >= MAX_RECORD_SECONDS) {
                    stopRecording();
                }
            }, 1000);

        } catch (err) {
            showToast(t('micError') + err.message);
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        clearInterval(recordingTimer);
        $('btn-record').classList.remove('recording');
        $('record-hint').textContent = t('recordHint');
        $('record-timer').classList.remove('active');
    }

    function updateRecordTimer() {
        $('record-timer').textContent = formatTime(recordingSeconds) + ' / ' + formatTime(MAX_RECORD_SECONDS);
    }

    function showReview() {
        if (!recordedBlob) return;
        $('record-area').style.display = 'none';
        $('review-area').classList.add('visible');
        $('btn-save-voice').disabled = false;
        $('btn-review-play').innerHTML = PLAY;

        var dur = (recordingSeconds) + ' s';
        $('review-duration').textContent = dur;
    }

    function reviewPlay() {
        if (!recordedBlob) return;
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }

        var url = URL.createObjectURL(recordedBlob);
        currentAudio = new Audio(url);
        var btn = $('btn-review-play');

        currentAudio.onplay = function() { btn.innerHTML = PAUSE; };
        currentAudio.onended = function() { btn.innerHTML = PLAY; currentAudio = null; };
        currentAudio.onpause = function() { btn.innerHTML = PLAY; };

        currentAudio.play();
    }

    function resetRecording() {
        recordedBlob = null;
        recordedChunks = [];
        recordingSeconds = 0;
        $('record-area').style.display = '';
        $('review-area').classList.remove('visible');
        $('record-timer').classList.remove('active');
        updateRecordTimer();
    }

    async function saveVoice() {
        if (!recordedBlob) return;
        var name = $('speaker-name').value.trim();
        if (!name) { showToast(t('nameRequired')); return; }

        $('btn-save-voice').disabled = true;
        $('btn-save-voice').textContent = t('savingBtn');

        try {
            var fd = new FormData();
            fd.append('audio', recordedBlob, 'recording.webm');

            if (rerecordMode && currentVoiceId) {
                var resp = await api('/api/voices/' + currentVoiceId, { method: 'PUT', body: fd });
                await resp.json();
                showToast(t('voiceReplaced'));
            } else {
                fd.append('name', name);
                var resp = await api('/api/voices', { method: 'POST', body: fd });
                var data = await resp.json();
                currentVoiceId = data.voice_id;
                currentVoiceName = name;
                clips = [];
                renderClips();
            }

            $('voice-name').textContent = currentVoiceName || name;
            rerecordMode = false;
            showScreen('screen-generate');
        } catch(_) {
            $('btn-save-voice').disabled = false;
        } finally {
            $('btn-save-voice').textContent = t('saveBtn');
        }
    }

    // --- Generation ---
    async function generateSpeech() {
        var text = $('gen-text').value.trim();
        if (!text) { showToast(t('textRequired')); return; }
        if (!currentVoiceId) { showToast(t('voiceRequired')); return; }

        var provider = $('gen-provider').value;
        // XTTS v2 has no Slovak; Czech is the closest supported language. Fish ignores the field.
        var genLang = (currentLang === 'sk' && provider === 'xtts') ? 'cs' : currentLang;
        $('btn-generate').disabled = true;
        $('gen-spinner').classList.add('visible');

        var elapsed = 0;
        $('gen-elapsed').textContent = '0:00';
        genTimerInterval = setInterval(function() {
            elapsed++;
            $('gen-elapsed').textContent = formatTime(elapsed);
        }, 1000);

        try {
            var controller = new AbortController();
            var timeout = setTimeout(function() { controller.abort(); }, 300000);

            var resp = await api('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    voice_id: currentVoiceId,
                    text: text,
                    provider_id: provider,
                    language: genLang
                }),
                signal: controller.signal
            });

            clearTimeout(timeout);
            var raw = await resp.json();
            clips.unshift({
                id: raw.clip_id,
                text: raw.text,
                provider: raw.provider_id,
                provider_name: raw.provider_name
            });
            renderClips();

        } catch(err) {
            if (err.name === 'AbortError') {
                showToast(t('timeoutError'));
            }
        } finally {
            clearInterval(genTimerInterval);
            $('btn-generate').disabled = false;
            $('gen-spinner').classList.remove('visible');
        }
    }

    // --- Clips ---
    function renderClips() {
        var list = $('clips-list');
        var heading = $('clips-heading-wrap');

        if (!clips.length) {
            list.innerHTML = '';
            heading.style.display = 'none';
            return;
        }

        heading.style.display = '';
        $('clips-heading').textContent = t('clipsHeading');
        list.innerHTML = '';

        clips.forEach(function(clip) {
            var card = document.createElement('div');
            card.className = 'clip-card';

            card.innerHTML =
                '<button class="clip-play-btn" type="button" data-clip-id="' + escapeHtml(String(clip.id)) + '" title="' + escapeHtml(t('playTitle')) + '">' + PLAY + '</button>' +
                '<div class="clip-info">' +
                    '<div class="clip-text">' + escapeHtml(clip.text) + '</div>' +
                    '<div class="clip-meta-row">' +
                        '<span class="provider-badge"><span class="ico ico-ai" aria-hidden="true"></span>' + escapeHtml(clip.provider_name || clip.provider) + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="clip-actions">' +
                    '<button class="clip-action-btn download" type="button" title="' + escapeHtml(t('downloadClipTitle')) + '">' + glyph('download') + '</button>' +
                    '<button class="clip-action-btn delete" type="button" title="' + escapeHtml(t('deleteClipTitle')) + '">' + glyph('close') + '</button>' +
                '</div>';

            var playBtn = card.querySelector('.clip-play-btn');
            playBtn.addEventListener('click', function() { playClip(clip.id, playBtn); });

            card.querySelector('.clip-action-btn.download').addEventListener('click', function() {
                downloadClip(clip.id);
            });

            card.querySelector('.clip-action-btn.delete').addEventListener('click', async function() {
                try {
                    await api('/api/clips/' + clip.id, { method: 'DELETE' });
                    clips = clips.filter(function(c) { return c.id !== clip.id; });
                    renderClips();
                } catch(_) {
                    showToast(t('cannotDeleteClip'));
                }
            });

            list.appendChild(card);
        });
    }

    function downloadClip(clipId) {
        var a = document.createElement('a');
        a.href = '/api/clips/' + clipId + '/audio';
        a.download = 'clip-' + clipId + '.wav';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function downloadVoiceAudio() {
        if (!currentVoiceId) return;
        var a = document.createElement('a');
        a.href = '/api/voices/' + currentVoiceId + '/audio';
        a.download = (currentVoiceName || 'voice') + '-reference.wav';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    async function playClip(clipId, btn) {
        if (currentAudio) {
            currentAudio.pause();
            if (currentPlayingBtn) {
                currentPlayingBtn.classList.remove('playing');
                currentPlayingBtn.innerHTML = PLAY;
            }
            if (currentPlayingBtn === btn) {
                currentAudio = null;
                currentPlayingBtn = null;
                return;
            }
        }

        btn.classList.add('playing');
        btn.innerHTML = PAUSE;

        try {
            var resp = await fetch('/api/clips/' + clipId + '/audio');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var blob = await resp.blob();
            var url = URL.createObjectURL(blob);
            var audio = new Audio(url);
            currentAudio = audio;
            currentPlayingBtn = btn;

            audio.onended = function() {
                btn.classList.remove('playing');
                btn.innerHTML = PLAY;
                URL.revokeObjectURL(url);
                currentAudio = null;
                currentPlayingBtn = null;
            };
            audio.onerror = function() {
                btn.classList.remove('playing');
                btn.innerHTML = PLAY;
                URL.revokeObjectURL(url);
                showToast(t('cannotPlayAudio'));
                currentAudio = null;
                currentPlayingBtn = null;
            };

            await audio.play();
        } catch(err) {
            btn.classList.remove('playing');
            btn.innerHTML = PLAY;
            showToast(t('cannotPlayAudio'));
            currentAudio = null;
            currentPlayingBtn = null;
        }
    }

    function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // --- Mode: clone voice vs. record sentences ---
    var currentMode = 'clone';
    var sentences = [];
    var sentRecs = {};          // sentence_idx -> recording metadata
    var sentActive = null;      // active sentence idx
    var sentVoiceId = null;     // link to cloned voice (pairs real + AI clips)
    var sentRecorder = null, sentChunks = [], sentBlob = null, sentTimer = null, sentSeconds = 0;
    var sentError = null;       // {idx, title, detail} of the last failed save (shown inline)
    var MAX_SENTENCE_SECONDS = 15;

    function setMode(mode) {
        if (sentRecorder && sentRecorder.state === 'recording') stopSentenceRecording();
        if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
        currentMode = mode;
        document.querySelectorAll('#mode-toggle .mode-card').forEach(function(b) {
            b.classList.toggle('active', b.dataset.mode === mode);
        });
        $('mode-clone').style.display = mode === 'clone' ? '' : 'none';
        $('mode-sentences').style.display = mode === 'sentences' ? '' : 'none';
        applyModeTexts();
        if (mode === 'sentences') loadSentences();
    }

    async function loadSentences() {
        try {
            var resp = await api('/api/sentences?lang=' + recLang);
            sentences = await resp.json();
        } catch(_) { sentences = []; }
        await loadSentenceRecordings();
    }

    async function loadSentenceRecordings() {
        sentRecs = {};
        var name = $('speaker-name').value.trim();
        if (name) {
            try {
                var resp = await api('/api/recordings?speaker=' + encodeURIComponent(name) + '&language=' + recLang);
                (await resp.json()).forEach(function(r) { sentRecs[r.sentence_idx] = r; });
            } catch(_) {}
        }
        renderSentences();
    }

    function renderSentences() {
        var list = $('sent-list');
        list.innerHTML = '';
        var done = Object.keys(sentRecs).length;
        $('sent-progress').innerHTML = escapeHtml(t('sentProgress'))
            .replace('{done}', '<b>' + done + '</b>').replace('{total}', String(sentences.length));

        sentences.forEach(function(s) {
            var rec = sentRecs[s.idx];
            var item = document.createElement('div');
            item.className = 'sent-item' + (sentActive === s.idx ? ' active' : '');
            var status = rec ? '<span class="sent-status">' + glyph('check') + ' ' + rec.duration_s.toFixed(1) + ' s</span>' : '';
            var play = rec ? '<button class="sent-play" type="button" title="' + escapeHtml(t('playTitle')) + '">' + PLAY + '</button>' : '';
            item.innerHTML =
                '<div class="sent-row">' +
                    '<span class="sent-num">' + (s.idx + 1) + '.</span>' +
                    '<span class="sent-text">' + escapeHtml(s.text) + '</span>' +
                    status + play +
                '</div>';
            if (rec) {
                item.querySelector('.sent-play').addEventListener('click', function(e) {
                    e.stopPropagation();
                    playClipUrl('/api/recordings/' + rec.recording_id + '/audio', e.currentTarget);
                });
            }
            if (sentActive === s.idx) item.appendChild(buildSentencePanel(s, rec));
            item.addEventListener('click', function() {
                if (sentActive === s.idx) return;
                if (!$('speaker-name').value.trim()) { showToast(t('nameRequired')); $('speaker-name').focus(); return; }
                if (sentRecorder && sentRecorder.state === 'recording') return;
                sentActive = s.idx;
                sentBlob = null;
                sentError = null;
                renderSentences();
                scrollActiveSentence();
            });
            list.appendChild(item);
        });
    }

    function scrollActiveSentence() {
        var el = document.querySelector('.sent-item.active');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function buildSentencePanel(s, rec) {
        var panel = document.createElement('div');
        panel.className = 'sent-panel';
        var recording = sentRecorder && sentRecorder.state === 'recording';
        if (!sentBlob) {
            panel.innerHTML =
                '<div class="record-hint">' + escapeHtml(recording ? t('recording') : t('sentRecordHint')) + '</div>' +
                '<button class="record-btn' + (recording ? ' recording' : '') + '" type="button" aria-label="Record"><div class="inner"></div></button>' +
                '<div class="record-timer' + (recording ? ' active' : '') + '">' +
                    formatTime(sentSeconds) + ' / ' + formatTime(MAX_SENTENCE_SECONDS) + '</div>' +
                (rec && !recording ? '<div class="review-actions"><button class="btn btn-ghost btn-sm" type="button" data-act="delete">' + escapeHtml(t('sentDelete')) + '</button></div>' : '');
            panel.querySelector('.record-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (sentRecorder && sentRecorder.state === 'recording') stopSentenceRecording();
                else startSentenceRecording();
            });
        } else {
            var err = (sentError && sentError.idx === s.idx) ? sentError : null;
            panel.innerHTML =
                (err ? '<div class="sent-error" role="alert"><b>' + escapeHtml(err.title) + '</b>' + escapeHtml(err.detail) + '</div>' : '') +
                '<div class="review-actions">' +
                    '<button class="btn btn-secondary btn-sm" type="button" data-act="play">' + PLAY + ' ' + sentSeconds + ' s</button>' +
                    '<button class="btn btn-secondary btn-sm" type="button" data-act="again">' + escapeHtml(t('sentRerecord')) + '</button>' +
                    '<button class="btn btn-primary btn-sm" type="button" data-act="save">' + escapeHtml(t('sentSave')) + '</button>' +
                '</div>';
        }
        panel.querySelectorAll('[data-act]').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var act = b.dataset.act;
                if (act === 'play') playClipUrl(URL.createObjectURL(sentBlob), b);
                if (act === 'again') { sentBlob = null; sentSeconds = 0; sentError = null; renderSentences(); }
                if (act === 'save') saveSentence(s.idx, b);
                if (act === 'delete') deleteSentence(rec);
            });
        });
        return panel;
    }

    async function startSentenceRecording() {
        try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            sentChunks = []; sentBlob = null; sentSeconds = 0; sentError = null;
            sentRecorder = new MediaRecorder(stream);
            sentRecorder.ondataavailable = function(e) { if (e.data.size > 0) sentChunks.push(e.data); };
            sentRecorder.onstop = function() {
                stream.getTracks().forEach(function(tr) { tr.stop(); });
                sentBlob = new Blob(sentChunks, { type: sentRecorder.mimeType });
                renderSentences();
            };
            sentRecorder.start(250);
            renderSentences();
            sentTimer = setInterval(function() {
                sentSeconds++;
                var timer = document.querySelector('.sent-item.active .record-timer');
                if (timer) timer.textContent = formatTime(sentSeconds) + ' / ' + formatTime(MAX_SENTENCE_SECONDS);
                if (sentSeconds >= MAX_SENTENCE_SECONDS) stopSentenceRecording();
            }, 1000);
        } catch (err) {
            showToast(t('micError') + err.message);
        }
    }

    function stopSentenceRecording() {
        clearInterval(sentTimer);
        if (sentRecorder && sentRecorder.state !== 'inactive') sentRecorder.stop();
    }

    var SAVE_ERROR_KEYS = { silent: 'errSilent', no_speech: 'errNoSpeech', too_short: 'errTooShort' };

    async function saveSentence(idx, btn) {
        var name = $('speaker-name').value.trim();
        if (!name || !sentBlob) return;
        btn.disabled = true;
        btn.textContent = t('savingBtn');
        try {
            var fd = new FormData();
            fd.append('audio', sentBlob, 'sentence.webm');
            fd.append('speaker', name);
            fd.append('language', recLang);
            fd.append('sentence_idx', String(idx));
            if (sentVoiceId) fd.append('voice_id', sentVoiceId);
            // Plain fetch (not api()): failures are shown inline in the sentence panel,
            // and the take is kept so the user can retry Save or re-record.
            var resp = await fetch('/api/recordings', { method: 'POST', body: fd });
            var body = {};
            try { body = await resp.json(); } catch(_) {}
            if (!resp.ok) {
                var key = SAVE_ERROR_KEYS[body.reason];
                sentError = {
                    idx: idx,
                    title: key ? t(key) : (t('saveFailed') + (body.error ? ' ' + body.error : ' HTTP ' + resp.status)),
                    detail: ' ' + t('errHint')
                };
                renderSentences();
                return;
            }
            var rec = body;
            sentRecs[idx] = rec;
            sentBlob = null; sentSeconds = 0; sentError = null;
            // advance to next unrecorded sentence
            var next = null;
            for (var i = 1; i <= sentences.length; i++) {
                var cand = sentences[(idx + i) % sentences.length].idx;
                if (!sentRecs[cand]) { next = cand; break; }
            }
            sentActive = next;
            showToast(t('sentSaved'), 1500);
            renderSentences();
            scrollActiveSentence();
        } catch(err) {
            sentError = { idx: idx, title: t('saveFailed') + ' ' + err.message, detail: '' };
            renderSentences();
        }
    }

    async function deleteSentence(rec) {
        if (!rec || !confirm(t('sentDeleteConfirm'))) return;
        try {
            await api('/api/recordings/' + rec.recording_id, { method: 'DELETE' });
            delete sentRecs[rec.sentence_idx];
            renderSentences();
        } catch(_) {}
    }

    function playClipUrl(url, btn) {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        currentAudio = new Audio(url);
        var label = btn.innerHTML;
        currentAudio.onended = currentAudio.onpause = function() { btn.innerHTML = label; };
        btn.innerHTML = label.indexOf('#g-play') >= 0 ? label.replace('#g-play', '#g-pause') : PAUSE;
        currentAudio.play().catch(function() { btn.innerHTML = label; showToast(t('cannotPlayAudio')); });
    }

    document.querySelectorAll('#mode-toggle .mode-card').forEach(function(b) {
        b.addEventListener('click', function() { setMode(b.dataset.mode); });
    });
    document.querySelectorAll('#rec-lang-toggle .seg-btn').forEach(function(b) {
        b.addEventListener('click', function() { setRecLang(b.dataset.slang); });
    });
    var nameDebounce = null;
    $('speaker-name').addEventListener('input', function() {
        if (currentMode !== 'sentences') return;
        sentVoiceId = null;   // typed a different name -> no longer linked to the cloned voice
        sentActive = null;
        clearTimeout(nameDebounce);
        nameDebounce = setTimeout(loadSentenceRecordings, 400);
    });
    $('btn-voice-sentences').addEventListener('click', function() {
        sentVoiceId = currentVoiceId;
        $('speaker-name').value = currentVoiceName || '';
        $('speaker-name').disabled = false;
        showScreen('screen-record');
        setMode('sentences');
    });

    // --- Event Listeners ---
    $('btn-record').addEventListener('click', function() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRecording();
        } else {
            startRecording();
        }
    });

    $('btn-refresh-prompt').addEventListener('click', showRandomPrompt);

    $('btn-review-play').addEventListener('click', reviewPlay);

    $('btn-rerecord').addEventListener('click', resetRecording);

    $('btn-save-voice').addEventListener('click', saveVoice);

    $('btn-generate').addEventListener('click', generateSpeech);

    $('btn-download-voice').addEventListener('click', downloadVoiceAudio);
    $('btn-play-voice').addEventListener('click', function() {
        if (!currentVoiceId) return;
        var b = $('btn-play-voice');
        if (currentAudio && !currentAudio.paused && b.innerHTML.indexOf('#g-pause') >= 0) { currentAudio.pause(); return; }
        playClipUrl('/api/voices/' + currentVoiceId + '/audio', b);
    });

    document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            switchLang(btn.dataset.lang);
        });
    });

    $('btn-rerecord-voice').addEventListener('click', function() {
        rerecordMode = true;
        recordedBlob = null;
        recordedChunks = [];
        resetRecording();
        $('speaker-name').value = currentVoiceName || '';
        $('speaker-name').disabled = true;
        showScreen('screen-record');
        setMode('clone');
    });

    $('btn-delete-voice').addEventListener('click', async function() {
        if (!currentVoiceId) return;
        if (!confirm(t('deleteConfirm').replace('{name}', currentVoiceName || ''))) return;
        try {
            await api('/api/voices/' + currentVoiceId, { method: 'DELETE' });
            currentVoiceId = null;
            currentVoiceName = null;
            clips = [];
            resetRecording();
            $('speaker-name').value = '';
            $('speaker-name').disabled = false;
            showScreen('screen-record');
            loadExistingVoices();
            showToast(t('voiceDeleted'));
        } catch(_) {
            showToast(t('cannotDelete'));
        }
    });

    $('btn-back-record').addEventListener('click', function() {
        currentVoiceId = null;
        currentVoiceName = null;
        rerecordMode = false;
        recordedBlob = null;
        recordedChunks = [];
        clips = [];
        resetRecording();
        $('speaker-name').value = '';
        $('speaker-name').disabled = false;
        showScreen('screen-record');
        setMode('clone');
        loadExistingVoices();
    });

    $('hdr-brand').addEventListener('click', goHome);
    $('hdr-brand').addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); } });
    try { history.replaceState({ vcs: 'screen-record', guard: true }, ''); history.pushState({ vcs: 'screen-record' }, ''); } catch (e) {}
    window.addEventListener('popstate', function(ev) {
        var st = ev.state || {};
        if (st.guard) {               // never leave the app: bounce back to the start screen
            try { history.pushState({ vcs: 'screen-record' }, ''); } catch (e) {}
            st = { vcs: 'screen-record' };
        }
        navFromHistory = true;
        try {
            if (st.vcs === 'screen-generate' && st.voice) {
                currentVoiceId = st.voice; currentVoiceName = st.name;
                $('voice-name').textContent = st.name || '';
                showScreen('screen-generate');
                if (typeof loadClipsForVoice === 'function') loadClipsForVoice(st.voice);
            } else {
                goHome();
            }
        } finally { navFromHistory = false; }
    });

    // --- Existing voices ---
    async function loadExistingVoices() {
        try {
            var resp = await api('/api/voices');
            var existingVoices = await resp.json();
            var section = $('existing-voices-section');
            var list = $('voice-picker-list');

            if (existingVoices.length === 0) {
                section.style.display = 'none';
                return;
            }

            list.innerHTML = '';
            existingVoices.forEach(function(v) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-ghost btn-sm voice-chip';
                btn.innerHTML = '<span class="ico ico-user" aria-hidden="true"></span>';
                btn.appendChild(document.createTextNode(v.name));
                btn.addEventListener('click', async function() {
                    currentVoiceId = v.voice_id;
                    currentVoiceName = v.name;
                    $('voice-name').textContent = v.name;
                    await loadClipsForVoice(v.voice_id);
                    showScreen('screen-generate');
                });
                list.appendChild(btn);
            });

            section.style.display = 'block';
        } catch(_) {}
    }

    async function loadClipsForVoice(voiceId) {
        try {
            var resp = await api('/api/clips?voice_id=' + voiceId);
            var data = await resp.json();
            clips = data.map(function(c) {
                return { id: c.clip_id, text: c.text, provider: c.provider_id, provider_name: c.provider_name };
            });
            renderClips();
        } catch(_) {}
    }

    // --- Init ---
    applyLang();
    document.querySelectorAll('#rec-lang-toggle .seg-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.slang === recLang);
    });
    loadPrompts();
    loadProviders();
    loadExistingVoices();

})();
</script>

</body>
</html>
