function pickedHtml(guess) {
    return esc(guess === 'ai' ? t('ai_generated') : t('natural_voice'));
}

function battleSubmitGuess(guess) {
    const elapsed = roundStartTime ? (performance.now() - roundStartTime) / 1000 : SPEED_WINDOW_SEC;
    totalPlayTime += elapsed;
    gameState._lastElapsed = elapsed;

    $('b-btn-ai').disabled = true; $('b-btn-human').disabled = true;
    $('battle-audio').pause();
    setBattlePlayIcon(false);
    $('b-human-controls').style.display = 'none';

    $('b-guess-left').innerHTML = pickedHtml(guess);
    $('b-guess-left').className = 'picked ' + guess;
    $('b-guess-left').hidden = false;

    const clip = gameState.clips[gameState.currentIndex];
    const aiResult = battleAiResults[clip.id] || {};
    const aiGuess = aiResult.guess || 'ai';
    const oppId = selectedOpponent.id;

    later(() => {
        $('b-ai-hidden').hidden = true;
        $('b-status-text').textContent = t('opponent_analyzing');
        $('b-status-right').hidden = false;
        later(() => {
            $('b-status-right').hidden = true;
            if (SPECTROGRAM_OPPONENTS.includes(oppId) && aiResult.spectrogram) {
                $('b-spectrogram-right').src = aiResult.spectrogram;
                $('b-spectrogram-right').hidden = false;
            }
            if (aiResult.reasoning) {
                $('b-reason-right').textContent = aiResult.reasoning;
                $('b-reason-right').hidden = false;
            }
            $('b-guess-right').innerHTML = pickedHtml(aiGuess);
            $('b-guess-right').className = 'picked ' + aiGuess;
            $('b-guess-right').hidden = false;
            later(() => battleRevealTruth(guess, aiGuess, clip), 2000);
        }, 1500);
    }, 1000);
}

function miniVerdict(el, ok) {
    el.innerHTML = glyph(ok ? 'check' : 'cross') + '<span>' + esc(ok ? t('correct') : t('wrong')) + '</span>';
    el.className = 'mini-verdict ' + (ok ? 'correct' : 'wrong');
    el.hidden = false;
}

function battleRevealTruth(humanGuess, aiGuess, clip) {
    const seq = gameSeq;
    fetch('/api/game/' + gameState.gameId + '/guess', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clip_id: clip.id, guess: humanGuess })
    }).then(res => res.json().then(d => { if (!res.ok) throw new Error(d.error); return d; })).then(data => {
        if (seq !== gameSeq) return;
        const actual = data.actual;
        const humanCorrect = humanGuess === actual;
        const aiCorrect = aiGuess === actual;
        if (humanCorrect) {
            humanBattleScore++;
            const elapsed = gameState._lastElapsed || SPEED_WINDOW_SEC;
            const speedBonus = Math.max(0, Math.round(POINTS_SPEED_MAX * (1 - elapsed / SPEED_WINDOW_SEC)));
            totalPoints += POINTS_BASE + speedBonus;
            speedBonusTotal += speedBonus; correctCount++;
        }
        if (aiCorrect) aiBattleScore++;
        gameState.results.push(humanCorrect);

        miniVerdict($('b-verdict-left'), humanCorrect);
        miniVerdict($('b-verdict-right'), aiCorrect);

        $('b-reveal-avatar').innerHTML = speakerAvatar(data, 'lg');
        const lines = speakerLines(data);
        $('b-reveal-who').className = 'who ' + lines.cls;
        $('b-reveal-who').textContent = lines.main;
        $('b-reveal-sub').textContent = lines.sub;

        renderBattleHeader();
        buildProgress($('b-progress'), gameState.results, -1);
        const isLast = gameState.currentIndex >= gameState.clips.length - 1;
        $('b-next-round').textContent = isLast ? t('see_results') : t('next_round');
        $('b-bottom-bar').hidden = false;
    }).catch(e => {
        if (seq !== gameSeq) return;
        toast(t('error_generic') + ' (' + e.message + ')');
        $('b-next-round').textContent = t('next_round');
        $('b-bottom-bar').hidden = false;
    });
}

function battleQuote(humanWon, tie, perfect) {
    const diff = LEVEL_NUM[oppMeta(selectedOpponent.id).level] || 2;
    const close = Math.abs(humanBattleScore - aiBattleScore) === 1;
    const zero = humanBattleScore === 0;
    const isBoss = diff >= 4;
    const isEasy = diff <= 1;
    if (perfect) return isBoss ? t('quote_win_boss_perfect') : t('quote_perfect');
    if (zero) return isEasy ? t('quote_lose_easy_zero') : t('quote_zero');
    if (humanWon && isBoss) return t('quote_win_boss');
    if (humanWon && isEasy && close) return t('quote_win_easy_close');
    if (humanWon && isEasy) return t('quote_win_easy');
    if (humanWon) return t('quote_win_medium');
    if (!tie && isBoss && close) return t('quote_lose_boss_close');
    if (!tie && isBoss) return t('quote_lose_boss');
    if (!tie && isEasy) return t('quote_lose_easy');
    if (!tie) return t('quote_lose_medium');
    if (isBoss) return t('quote_tie_boss');
    if (isEasy) return t('quote_tie_easy');
    return t('quote_tie_medium');
}

async function battleShowFinal() {
    const seq = gameSeq;
    const humanWon = humanBattleScore > aiBattleScore;
    const tie = humanBattleScore === aiBattleScore;
    const perfect = humanBattleScore === GAME_SIZE;
    let oppBonus = 0;
    if (humanWon || (tie && perfect)) {
        oppBonus = OPPONENT_BONUS[selectedOpponent.id] || 0;
        totalPoints += oppBonus;
    }
    $('b-next-round').disabled = true;
    let data = null;
    try {
        const res = await fetch('/api/game/' + gameState.gameId + '/complete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ points: totalPoints, duration_sec: Math.round(totalPlayTime * 10) / 10, opponent: selectedOpponent ? selectedOpponent.id : null })
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.error);
    } catch (e) {
        toast(t('error_generic') + ' (' + e.message + ')');
        data = null;
    }
    $('b-next-round').disabled = false;
    if (seq !== gameSeq) return;
    await finishWithResults({
        mode: 'battle',
        oppId: selectedOpponent.id,
        humanScore: humanBattleScore, aiScore: aiBattleScore,
        quote: battleQuote(humanWon, tie, perfect),
        score: data ? data.score : humanBattleScore,
        total: data ? data.total : GAME_SIZE,
        points: data ? data.points : totalPoints,
        rank: data ? data.rank : null,
        prize: data ? !!data.prize : null,
        correct: correctCount, speed: speedBonusTotal, oppBonus: oppBonus,
    });
}

// ---------- Idle booth reset ----------
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => {
    lastActivity = Date.now();
    if (!history.state || history.state.vid !== 'app') pushHist();
}, { passive: true }));
setInterval(() => {
    if (inGame || !player.name) return;
    if (!['menu', 'results', 'leaderboard', 'opponents'].includes(currentScreen)) return;
    if (Date.now() - lastActivity > IDLE_RESET_MS) resetToRegistration();
}, 5000);

// ---------- Init ----------
try { history.replaceState({ vid: 'guard' }, ''); } catch (e) {}
showScreen('register');
loadI18n();
checkAiJudge();
</script>
