<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice ID: how it works</title>
<!--
  Fonts: Red Hat Display / Red Hat Text, SIL Open Font License (static/fonts/OFL.txt), embedded locally for offline booths.
  Icons: Red Hat standard icons, CC BY 4.0, https://github.com/RedHat-UX/red-hat-icons (static/icons/ICON-LICENSE).
  Icon files are unmodified. Everything else on this page (diagram, waveforms, chips) is plain inline SVG, no external libraries.
  Facts on this page mirror docs/ARCHITECTURE.md and infra/*/manifests.yaml. If they disagree, the manifests win.
-->
<style>
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

:root {
    --rh-red: #ee0000;
    --rh-red-dark: #a60000;
    --bg: #ffffff;
    --surface: #f2f2f2;
    --border: #c7c7c7;
    --divider: #e0e0e0;
    --text: #151515;
    --text-muted: #4d4d4d;
    --ai: #5e40be;
    --human: #147878;
    --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 18px; }
@media (max-width: 1400px) { html { font-size: 16px; } }
html, body { height: 100%; }
body {
    font-family: 'Red Hat Text', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; line-height: 1.2; }
button { font-family: inherit; color: inherit; }

/* ---------- Header ---------- */
.app-header {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.5rem 1.4rem;
    border-bottom: 1px solid var(--divider);
}
.brand { display: flex; align-items: center; gap: 1.2rem; min-width: 0; }
.brand img { height: 52px; width: auto; display: block; }
.brand .titles { border-left: 1px solid var(--divider); padding-left: 1.2rem; min-width: 0; }
.brand h1 { font-size: 1.45rem; }
.brand p { font-size: 0.9rem; color: var(--text-muted); }
.header-actions { display: flex; align-items: center; gap: 0.6rem; flex: none; }
.hdr-btn {
    display: inline-flex; align-items: center; gap: 0.45rem;
    min-height: 48px; padding: 0 1rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); cursor: pointer; font-weight: 700; font-size: 0.9rem;
    color: var(--text); text-decoration: none;
}
.hdr-btn:hover { border-color: var(--text); }
.hdr-btn[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.hdr-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Stepper ---------- */
.stepper {
    flex: none;
    display: flex; align-items: center; gap: 1rem;
    margin: 0.7rem 1.4rem 0;
    padding: 0.6rem 0.8rem;
    background: var(--surface);
    border-radius: var(--radius);
}
.step-btn {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); cursor: pointer;
    display: grid; place-items: center;
}
.step-btn:hover { border-color: var(--text); }
.step-btn svg { width: 24px; height: 24px; fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
/* All step texts share one grid cell, so the bar is always as tall as the longest step
   and the diagram below never jumps when the step changes. */
.step-copy { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.step-copy > div { grid-area: 1 / 1; min-width: 0; }
.step-size-reference { visibility: hidden; pointer-events: none; }
.step-head { display: flex; align-items: baseline; gap: 0.8rem; flex-wrap: wrap; }
.step-num { font-weight: 700; font-size: 0.85rem; color: var(--rh-red-dark); }
.step-title { font-size: 1.3rem; }
.step-desc { font-size: 1rem; color: var(--text); max-width: 78rem; margin-top: 0.15rem; }
.dots { flex: none; display: flex; gap: 0.15rem; }
.dot { width: 30px; height: 44px; border: none; background: none; cursor: pointer; display: grid; place-items: center; }
.dot::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
.dot.active::before { background: var(--rh-red); }
@media (max-width: 1400px) { .dots { display: none; } }

/* ---------- Diagram ---------- */
.stage { flex: 1; min-height: 0; padding: 0.4rem 1.4rem 0; display: flex; }
#arch { width: 100%; height: 100%; display: block; }
#arch text { font-family: 'Red Hat Text', system-ui, sans-serif; fill: var(--text); }
#arch .t-zone { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; font-size: 22px; }
#arch .t-group { font-weight: 700; font-size: 16px; fill: var(--text-muted); }
#arch .t-name { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; font-size: 22px; }
#arch .t-sub { font-size: 16px; }
#arch .t-small { font-size: 16px; fill: var(--text-muted); }
#arch .t-badge { font-size: 13px; font-weight: 700; }
#arch .t-status { font-size: 15px; fill: var(--text-muted); }
#arch .t-status.on { fill: var(--text); font-weight: 700; }
#arch .t-flow { font-size: 15px; fill: var(--text-muted); }
#arch .t-human { fill: var(--human); }
#arch .t-ai { fill: var(--ai); }
#arch .t-white { fill: #fff; }

.node { transition: opacity 0.35s; }
.node > rect.box { fill: #fff; stroke: #8c8c8c; stroke-width: 1.5; transition: stroke 0.25s, stroke-width 0.25s; }
.focus .node { opacity: 0.38; }
.focus .node.active { opacity: 1; }
.node.active > rect.box { stroke: var(--rh-red); stroke-width: 3.5; }
.node.off > rect.box { stroke-dasharray: 5 5; }

.flow { fill: none; stroke: #8c8c8c; stroke-width: 2.2; transition: stroke 0.25s, opacity 0.35s; }
.flow.dashed { stroke-dasharray: 7 6; }
.focus .flow { opacity: 0.3; }
.flow.active { stroke: var(--rh-red); stroke-width: 4; opacity: 1; stroke-dasharray: 12 8; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -40; } }
@media (prefers-reduced-motion: reduce) { .flow.active { animation: none; } }

/* ---------- Legend / footer ---------- */
.legend {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.6rem;
    padding: 0.45rem 1.4rem 0.6rem;
    font-size: 0.85rem; color: var(--text-muted);
}
.legend .k { display: inline-flex; align-items: center; gap: 0.45rem; }
.sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.sw-line { width: 26px; height: 0; border-top: 3px solid var(--rh-red); }
.sw-dash { width: 26px; height: 0; border-top: 2px dashed #8c8c8c; }
.chip-gpu { background: #151515; color: #fff; font-weight: 700; font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 4px; }
.chip-cpu { border: 1.5px solid #4d4d4d; color: var(--text); font-weight: 700; font-size: 0.75rem; padding: 0.05rem 0.4rem; border-radius: 4px; }
.legend .credit { margin-left: auto; font-size: 0.75rem; }

/* ---------- Tablet / smaller screens: give the diagram the height ---------- */
@media (max-width: 1400px), (max-height: 900px) {
    .app-header { padding: 0.35rem 1rem; }
    .brand img { height: 44px; }
    .brand h1 { font-size: 1.25rem; }
    .brand p { font-size: 0.8rem; }
    .hdr-btn { min-height: 44px; }
    .stepper { margin: 0.5rem 1rem 0; padding: 0.45rem 0.6rem; gap: 0.7rem; }
    .step-btn { width: 48px; height: 48px; }
    .step-title { font-size: 1.1rem; }
    .step-desc { font-size: 0.9rem; line-height: 1.35; }
    .stage { padding: 0.3rem 0.6rem 0; }
    .legend { padding: 0.3rem 1rem 0.45rem; gap: 0.3rem 1.1rem; font-size: 0.78rem; }
}
</style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <a href="/" aria-label="Back to the game"><img src="/static/logo-light-compact.png" alt="Voice ID: AI or Alive?"></a>
        <div class="titles">
            <h1>How Voice ID works</h1>
            <p>Red Hat OpenShift and Red Hat OpenShift AI on NVIDIA L4 GPUs</p>
        </div>
    </div>
    <div class="header-actions">
        <button class="hdr-btn" id="btn-auto" type="button" aria-pressed="false" title="Advance automatically every 12 seconds">
            <svg viewBox="0 0 24 24"><polygon points="7,5 19,12 7,19" fill="currentColor" stroke="none"/></svg><span>Auto tour</span>
        </button>
        <a class="hdr-btn" href="/">
            <svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg><span>Back to game</span>
        </a>
    </div>
</header>

<section class="stepper" aria-live="polite">
    <button class="step-btn" id="btn-prev" type="button" aria-label="Previous step"><svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg></button>
    <div class="step-copy" id="step-copy">
        <div id="step-active">
            <div class="step-head"><span class="step-num" id="step-num"></span><h2 class="step-title" id="step-title"></h2></div>
            <p class="step-desc" id="step-desc"></p>
        </div>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Steps"></div>
    <button class="step-btn" id="btn-next" type="button" aria-label="Next step"><svg viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19"/></svg></button>
</section>

<main class="stage">
<svg id="arch" viewBox="0 0 1600 730" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice ID architecture diagram">
    <defs>
        <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="#8c8c8c"/>
        </marker>
        <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="#ee0000"/>
        </marker>
    </defs>

    <!-- ================= Zones (static frames) ================= -->
    <text class="t-zone" x="20" y="44">At the booth</text>

    <rect x="290" y="8" width="1294" height="714" rx="16" fill="none" stroke="#151515" stroke-width="1.5"/>
    <rect x="310" y="24" width="8" height="24" fill="#ee0000"/>
    <text class="t-zone" x="328" y="44">Red Hat OpenShift</text>

    <!-- AI opponents frame -->
    <rect x="650" y="58" width="914" height="280" rx="14" fill="#f2f2f2"/>
    <text class="t-zone" x="670" y="88">AI opponents</text>
    <text class="t-small" x="830" y="88">battle mode: the game backend asks one of them about each clip</text>
    <rect x="666" y="100" width="446" height="190" rx="10" fill="none" stroke="#707070" stroke-width="1.2" stroke-dasharray="6 5"/>
    <image href="/static/icons/ai-inference.svg" x="680" y="106" width="26" height="26"/>
    <text class="t-group" x="712" y="125">Red Hat OpenShift AI · KServe + vLLM</text>
    <rect x="1124" y="100" width="424" height="190" rx="10" fill="none" stroke="#707070" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text class="t-group" x="1140" y="125">Classifiers · plain Deployments</text>

    <!-- Voice cloning frame -->
    <rect x="650" y="372" width="474" height="274" rx="14" fill="#f2f2f2"/>
    <text class="t-zone" x="670" y="402">Voice cloning engines</text>
    <text class="t-small" x="670" y="424">used by Clone Studio only, never by the game</text>

    <!-- Same person frame -->
    <rect x="1140" y="372" width="424" height="274" rx="14" fill="#fff" stroke="#c7c7c7" stroke-width="1.5"/>
    <text class="t-zone" x="1160" y="402">Same person, real vs clone</text>
    <text class="t-small" x="1160" y="630">Both versions go into the game. Can you tell?</text>

    <!-- ================= Flows ================= -->
    <g id="flows">
        <path id="f-play"  class="flow" d="M250,112 H324" marker-end="url(#arr-g)"/>
        <path id="f-audio" class="flow dashed" d="M330,156 H256" marker-end="url(#arr-g)"/>
        <path id="f-tv"    class="flow" d="M250,282 H270 V190 H324" marker-end="url(#arr-g)"/>
        <path id="f-db"    class="flow" d="M470,212 V232" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
        <path id="f-teddy" class="flow" d="M610,170 H632 V310 H786 V280" marker-end="url(#arr-g)"/>
        <path id="f-iris"  class="flow" d="M610,170 H632 V310 H1000 V280" marker-end="url(#arr-g)"/>
        <path id="f-gary"  class="flow" d="M610,170 H632 V310 H1236 V280" marker-end="url(#arr-g)"/>
        <path id="f-gary2" class="flow" d="M610,170 H632 V310 H1441 V280" marker-end="url(#arr-g)"/>
        <path id="f-rec"   class="flow" d="M250,500 H324" marker-end="url(#arr-g)"/>
        <path id="f-studiodb" class="flow" d="M470,584 V602" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
        <path id="f-xtts"  class="flow" d="M610,490 H662" marker-end="url(#arr-g)"/>
        <path id="f-fish"  class="flow" d="M610,550 H636 V620 H1000 V602" marker-end="url(#arr-g)"/>
        <path id="f-clone" class="flow" d="M1104,562 H1154" marker-end="url(#arr-g)"/>
        <path id="f-real"  class="flow dashed" d="M610,452 H630 V356 H1132 V466 H1154" marker-end="url(#arr-g)"/>
        <path id="f-import" class="flow dashed" d="M470,436 V344" marker-end="url(#arr-g)"/>
    </g>
    <text class="t-flow" x="484" y="384">import tool</text>
    <text class="t-flow" x="484" y="404">or seed pack</text>

    <!-- ================= Nodes ================= -->
    <g id="nodes">
        <!-- Booth -->
        <g class="node" id="n-player">
            <rect class="box" x="20" y="64" width="230" height="132" rx="12"/>
            <image href="/static/icons/user.svg" x="36" y="78" width="40" height="40"/>
            <text class="t-name" x="86" y="106">Player</text>
            <text class="t-sub" x="36" y="150">Tablet browser</text>
            <text class="t-small" x="36" y="174">plays the game at /</text>
        </g>
        <g class="node" id="n-tv">
            <rect class="box" x="20" y="224" width="230" height="112" rx="12"/>
            <image href="/static/icons/bar-graph.svg" x="36" y="238" width="40" height="40"/>
            <text class="t-name" x="86" y="266">Booth monitor</text>
            <text class="t-sub" x="36" y="304">Leaderboard at /tv</text>
            <text class="t-small" x="36" y="326">refreshes every 10 s</text>
        </g>
        <g class="node" id="n-speaker">
            <rect class="box" x="20" y="436" width="230" height="132" rx="12"/>

            <text class="t-sub" x="36" y="522">Records their voice</text>
            <text class="t-small" x="36" y="546">in Clone Studio</text>
        </g>

        <!-- Game -->
        <g class="node" id="n-game">
            <rect class="box" x="330" y="64" width="280" height="144" rx="12"/>

            <text class="t-sub" x="348" y="120">Flask + gunicorn</text>

            <rect x="348" y="154" width="48" height="24" rx="4" fill="#fff" stroke="#4d4d4d" stroke-width="1.5"/>

            <text class="t-small" x="348" y="198">1 pod · Route with edge TLS</text>
        </g>
        <g class="node" id="n-gamedb">
            <rect class="box" x="330" y="236" width="280" height="100" rx="12"/>

            <text class="t-name" x="390" y="275">Game database</text>

        <!-- Opponents -->
        <g class="node" id="n-teddy" data-opp="qwen">

            <text class="t-name" x="698" y="166">Teddy</text>

            <text class="t-badge t-white" x="740" y="241" text-anchor="middle">L4 GPU 1</text>
            <text class="t-status" x="698" y="266">checking…</text>
        </g>
        <g class="node" id="n-iris" data-opp="gemma">
            <rect class="box" x="896" y="136" width="208" height="140" rx="10"/>
            <text class="t-name" x="912" y="166">Iris</text>
            <!-- tiny spectrogram glyph: Iris is the only opponent that uses one -->
            <g transform="translate(1032,148)" fill="#5e40be">
                <rect x="0" y="14" width="5" height="8" opacity="0.35"/><rect x="7" y="8" width="5" height="14" opacity="0.6"/>
                <rect x="14" y="2" width="5" height="20"/><rect x="21" y="9" width="5" height="13" opacity="0.6"/>
                <rect x="28" y="5" width="5" height="17" opacity="0.8"/><rect x="35" y="13" width="5" height="9" opacity="0.35"/>
                <rect x="42" y="7" width="5" height="15" opacity="0.6"/><rect x="49" y="12" width="5" height="10" opacity="0.8"/>
                <rect x="56" y="15" width="5" height="7" opacity="0.35"/>
            </g>
            <text class="t-sub" x="912" y="190">Gemma-4-12B FP8</text>
            <text class="t-small" x="912" y="212">looks at a spectrogram</text>
            <rect x="912" y="224" width="84" height="24" rx="4" fill="#151515"/>

            <text class="t-status" x="912" y="266">checking…</text>
        </g>
        <g class="node" id="n-gary" data-opp="gary-base">

            <text class="t-name" x="1152" y="166">Gary</text>
            <text class="t-sub" x="1152" y="190">Wav2Vec2, base</text>

            <text class="t-badge" x="1176" y="241" text-anchor="middle">CPU</text>
            <text class="t-status" x="1152" y="266">checking…</text>
        </g>
        <g class="node" id="n-gary2" data-opp="gary-finetuned">

        <!-- Cloning engines -->

            <rect class="box" x="666" y="438" width="214" height="160" rx="10"/>
            <text class="t-name" x="682" y="472">XTTS v2</text>

            <text class="t-badge t-white" x="724" y="575" text-anchor="middle">L4 GPU 3</text>
        </g>
        <g class="node" id="n-fish">
            <rect class="box" x="890" y="438" width="214" height="160" rx="10"/>
            <text class="t-name" x="906" y="472">Fish Speech</text>
            <text class="t-sub" x="906" y="498">S2 Pro, torch.compile</text>
            <text class="t-small" x="906" y="522">highest-quality clone</text>
            <rect x="906" y="558" width="84" height="24" rx="4" fill="#151515"/>
            <text class="t-badge t-white" x="948" y="575" text-anchor="middle">L4 GPU 4</text>
        </g>

        <!-- Same person: real vs clone -->
        <g class="node" id="n-real">
            <rect class="box" x="1160" y="424" width="384" height="84" rx="10" style="stroke:#147878;stroke-width:2.5"/>
            <g transform="translate(1178,444)" fill="#147878">
                <rect x="0" y="14" width="6" height="16" rx="3"/><rect x="10" y="6" width="6" height="32" rx="3"/>
                <rect x="20" y="0" width="6" height="44" rx="3"/><rect x="30" y="10" width="6" height="24" rx="3"/>
                <rect x="40" y="16" width="6" height="12" rx="3"/>
            </g>
            <text class="t-name t-human" x="1240" y="458">Real recording</text>
            <text class="t-small" x="1240" y="486">the speaker reads a sentence</text>
        </g>
        <g class="node" id="n-clone">
            <rect class="box" x="1160" y="520" width="384" height="84" rx="10" style="stroke:#5e40be;stroke-width:2.5"/>
            <g transform="translate(1178,540)" fill="#5e40be">
                <rect x="0" y="14" width="6" height="16" rx="1"/><rect x="10" y="6" width="6" height="32" rx="1"/>
                <rect x="20" y="0" width="6" height="44" rx="1"/><rect x="30" y="10" width="6" height="24" rx="1"/>
                <rect x="40" y="16" width="6" height="12" rx="1"/>
            </g>
            <text class="t-name t-ai" x="1240" y="554">AI clone</text>
            <text class="t-small" x="1240" y="582">same voice, same sentence, generated</text>
        </g>

        <!-- GPU nodes -->
        <g class="node" id="n-gpu">
            <rect class="box" x="650" y="660" width="914" height="48" rx="10" style="fill:#151515;stroke:#151515"/>
            <image href="/static/icons/gpu.svg" x="664" y="666" width="36" height="36" style="filter:invert(1)"/>
            <text class="t-sub t-white" x="710" y="690"><tspan font-weight="700">4 × g6.2xlarge GPU nodes</tspan> · one NVIDIA L4 (24 GB) each · one whole GPU per workload</text>
        </g>
    </g>
</svg>
</main>

<footer class="legend">
    <span class="k"><span class="sw" style="background:var(--human)"></span>Human voice</span>
    <span class="k"><span class="sw" style="background:var(--ai)"></span>AI voice</span>
    <span class="k"><span class="sw-line"></span>Active data flow</span>
    <span class="k"><span class="sw-dash"></span>Audio to player, or operator step</span>
    <span class="k"><span class="chip-gpu">L4 GPU</span>GPU workload</span>
    <span class="k"><span class="chip-cpu">CPU</span>CPU workload</span>
    <span class="k" id="status-note">● Opponent status: this game’s configuration</span>
    <span class="credit">Icons: Red Hat standard icons, CC BY 4.0</span>
</footer>

<script>
(function () {
    'use strict';

    // Each step highlights nodes (n-*) and flows (f-*). Facts: docs/ARCHITECTURE.md, infra/*/manifests.yaml.
    const STEPS = [
        {
            title: 'Voice ID at a glance',
            desc: 'Two small Flask apps and six model servers on one Red Hat OpenShift cluster. Follow a voice from a real person, through a clone, to the game and the AI opponents. Use the arrows, the arrow keys, or Auto tour.',
            nodes: [], flows: []
        },
        {
            title: 'A player starts a game',
            desc: 'The player opens the game on a tablet. An OpenShift route with edge TLS passes the request to the Voice ID pod: Flask and gunicorn on ordinary CPU. The game itself needs no GPU.',
            nodes: ['n-player', 'n-game'], flows: ['f-play']
        },
        {
            title: 'Five clips from the game database',
            desc: 'The server picks five random clips, at least one AI and one human, and streams the audio from SQLite on a persistent volume. The server decides what is right; the browser only adds up points.',
            nodes: ['n-player', 'n-game', 'n-gamedb'], flows: ['f-db', 'f-audio']
        },
        {
            title: 'Battle: Teddy listens',
            desc: 'In battle mode the game backend sends every clip to the chosen opponent. Teddy is Qwen2-Audio-7B, served by vLLM as a KServe LLMInferenceService in Red Hat OpenShift AI on its own NVIDIA L4. He hears the raw audio with a forensic prompt.',
            nodes: ['n-game', 'n-teddy'], flows: ['f-teddy']
        },
        {
            title: 'Battle: Iris looks at a picture',
            desc: 'Iris is Gemma-4-12B (the Red Hat AI FP8 build) on vLLM, on a second L4. She never hears the clip: the backend draws a spectrogram image and Iris judges the picture. She is the only opponent that uses spectrograms.',
            nodes: ['n-game', 'n-iris'], flows: ['f-iris']
        },
        {
            title: 'Battle: Gary and Gary 2.0',
            desc: 'The Garys are Wav2Vec2 deepfake classifiers in plain CPU Deployments, no GPU. They score the waveform and return a fake probability. Gary 2.0 was fine-tuned on the voices in this game: about 90% balanced accuracy, and he rarely accuses a real human.',
            nodes: ['n-game', 'n-gary', 'n-gary2'], flows: ['f-gary', 'f-gary2']
        },
        {
            title: 'Results on the booth monitor',
            desc: 'Every finished game lands on the leaderboard. The booth monitor shows /tv and asks the game API for the latest standings every 10 seconds.',
            nodes: ['n-tv', 'n-game', 'n-gamedb'], flows: ['f-tv', 'f-db']
        },
        {
            title: 'A real person records',
            desc: 'Behind the scenes, a speaker reads short sentences in Czech, Slovak or English in Voice Clone Studio. The recordings stay in the studio’s own SQLite database on a persistent volume. These become the human clips.',
            nodes: ['n-speaker', 'n-studio', 'n-studiodb', 'n-real'], flows: ['f-rec', 'f-studiodb', 'f-real']
        },
        {
            title: 'Cloning the same voice',
            desc: 'About 30 seconds of the speaker’s voice registers a clone at XTTS v2 and Fish Speech S2 Pro, each on its own L4. Both then speak the same sentences in that voice. These become the AI clips.',
            nodes: ['n-studio', 'n-xtts', 'n-fish', 'n-clone'], flows: ['f-xtts', 'f-fish', 'f-clone']
        },
        {
            title: 'Same person, real vs clone',
            desc: 'An operator imports the matching pairs into the game with the import tool or a private seed pack. The game never calls the voice engines live, and voice data lives only in the cluster databases: never in Git, an image or a public place.',
            nodes: ['n-studio', 'n-studiodb', 'n-gamedb', 'n-real', 'n-clone'], flows: ['f-import']
        },
        {
            title: 'The platform underneath',
            desc: 'Four AWS g6.2xlarge nodes, one NVIDIA L4 each, one whole GPU per workload. Red Hat OpenShift runs everything; Red Hat OpenShift AI serves the two LLM opponents through KServe and vLLM. The apps and the Garys run on regular CPU workers.',
            nodes: ['n-gpu', 'n-teddy', 'n-iris', 'n-xtts', 'n-fish'], flows: []
        }
    ];

    const svg = document.getElementById('arch');
    const flowsLayer = document.getElementById('flows');
    const allFlows = Array.from(document.querySelectorAll('.flow'));
    const allNodes = Array.from(document.querySelectorAll('.node'));
    const dots = document.getElementById('dots');
    let current = 0;
    let autoTimer = null;

    // Reserve height for the longest step text (invisible siblings in the same grid cell).
    const active = document.getElementById('step-active');
    STEPS.forEach((s, i) => {
        const ref = active.cloneNode(true);
        ref.removeAttribute('id');
        ref.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
        ref.classList.add('step-size-reference');
        ref.setAttribute('aria-hidden', 'true');
        ref.querySelector('.step-num').textContent = `Step ${i + 1} of ${STEPS.length}`;
        ref.querySelector('.step-title').textContent = s.title;
        ref.querySelector('.step-desc').textContent = s.desc;
        document.getElementById('step-copy').appendChild(ref);

        const d = document.createElement('button');
        d.type = 'button';
        d.className = 'dot';
        d.setAttribute('role', 'tab');
        d.setAttribute('aria-label', `Step ${i + 1}: ${s.title}`);
        d.addEventListener('click', () => { go(i); restartAuto(); });
        dots.appendChild(d);
    });

    function render() {
        const s = STEPS[current];
        document.getElementById('step-num').textContent = `Step ${current + 1} of ${STEPS.length}`;
        document.getElementById('step-title').textContent = s.title;
        document.getElementById('step-desc').textContent = s.desc;
        Array.from(dots.children).forEach((d, i) => {
            d.classList.toggle('active', i === current);
            d.setAttribute('aria-selected', i === current ? 'true' : 'false');
        });

        const focus = s.nodes.length > 0 || s.flows.length > 0;
        svg.classList.toggle('focus', focus);
        const nodeSet = new Set(s.nodes);
        allNodes.forEach(n => n.classList.toggle('active', nodeSet.has(n.id)));
        const flowSet = new Set(s.flows);
        allFlows.forEach(f => {
            const on = flowSet.has(f.id);
            f.classList.toggle('active', on);
            const m = on ? 'url(#arr-r)' : 'url(#arr-g)';
            f.setAttribute('marker-end', m);
            if (f.hasAttribute('marker-start')) f.setAttribute('marker-start', m);
            // Shared bus segments: draw active flows last so they sit on top.
            if (on) flowsLayer.appendChild(f);
        });
    }

    function go(i) { current = (i + STEPS.length) % STEPS.length; render(); }
    function next() { go(current + 1); }
    function prev() { go(current - 1); }

    function setAuto(on) {
        const btn = document.getElementById('btn-auto');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        clearInterval(autoTimer);
        autoTimer = on ? setInterval(next, 12000) : null;
    }
    function restartAuto() { if (autoTimer) setAuto(true); }

    document.getElementById('btn-next').addEventListener('click', () => { next(); restartAuto(); });
    document.getElementById('btn-prev').addEventListener('click', () => { prev(); restartAuto(); });
    document.getElementById('btn-auto').addEventListener('click', () => setAuto(!autoTimer));
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); restartAuto(); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); restartAuto(); }
    });

    // ---------- Live status (read-only endpoints the game already exposes) ----------
    // /api/battle/opponents lists the opponents configured in this deployment.
    function setOppStatus(list) {
        const ids = new Set((list || []).filter(o => o.available).map(o => o.id));
        document.querySelectorAll('[data-opp]').forEach(g => {
            const t = g.querySelector('.t-status');
            const on = ids.has(g.dataset.opp);
            t.textContent = on ? '● In the game' : 'Not configured here';
            t.classList.toggle('on', on);
            g.classList.toggle('off', !on);
        });
    }
    function refreshStatus() {
        fetch('/api/battle/opponents', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(setOppStatus)
            .catch(() => document.querySelectorAll('[data-opp] .t-status').forEach(t => { t.textContent = 'status unknown'; }));
        fetch('/api/leaderboard', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(d => {
                const n = d.total_players || 0;
                const t = document.getElementById('st-game');
                t.textContent = `● Live · ${n} player${n === 1 ? '' : 's'}`;
                t.classList.add('on');
            })
            .catch(() => { document.getElementById('st-game').textContent = 'status unknown'; });
    }

    if (new URLSearchParams(location.search).get('auto') === '1') setAuto(true);
    const startStep = parseInt(new URLSearchParams(location.search).get('step') || '1', 10);
    go(Number.isFinite(startStep) ? startStep - 1 : 0);
    refreshStatus();
    setInterval(refreshStatus, 30000);
})();
</script>
</body>
</html>
