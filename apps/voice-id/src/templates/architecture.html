<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice ID: how it works</title>
<!--
  Fonts: Red Hat Display / Red Hat Text, SIL Open Font License (static/fonts/OFL.txt), embedded locally for offline booths.
  Icons: Red Hat standard icons, CC BY 4.0, https://github.com/RedHat-UX/red-hat-icons (static/icons/ICON-LICENSE).
  Icon files are unmodified. Everything else on this page (diagram, waveforms, chips) is plain inline SVG, no external libraries.
  Facts on this page mirror docs/ARCHITECTURE.md and infra/*/manifests.yaml. If they disagree, the manifests win.
-->
<style>
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Display'; src: url('/static/fonts/RedHatDisplay-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Red Hat Text'; src: url('/static/fonts/RedHatText-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

:root {
    --rh-red: #ee0000;
    --rh-red-dark: #a60000;
    --bg: #ffffff;
    --surface: #f2f2f2;
    --border: #c7c7c7;
    --divider: #e0e0e0;
    --text: #151515;
    --text-muted: #4d4d4d;
    --ai: #5e40be;
    --human: #147878;
    --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 18px; }
@media (max-width: 1400px) { html { font-size: 16px; } }
html, body { height: 100%; }
body {
    font-family: 'Red Hat Text', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; line-height: 1.2; }
button { font-family: inherit; color: inherit; }

/* ---------- Header ---------- */
.app-header {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.5rem 1.4rem;
    border-bottom: 1px solid var(--divider);
}
.brand { display: flex; align-items: center; gap: 1.2rem; min-width: 0; }
.brand img { height: 52px; width: auto; display: block; }
.brand .titles { border-left: 1px solid var(--divider); padding-left: 1.2rem; min-width: 0; }
.brand h1 { font-size: 1.45rem; }
.brand p { font-size: 0.9rem; color: var(--text-muted); }
.header-actions { display: flex; align-items: center; gap: 0.6rem; flex: none; }
.hdr-btn {
    display: inline-flex; align-items: center; gap: 0.45rem;
    min-height: 48px; padding: 0 1rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); cursor: pointer; font-weight: 700; font-size: 0.9rem;
    color: var(--text); text-decoration: none;
}
.hdr-btn:hover { border-color: var(--text); }
.hdr-btn[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.hdr-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Stepper ---------- */
.stepper {
    flex: none;
    display: flex; align-items: center; gap: 1rem;
    margin: 0.7rem 1.4rem 0;
    padding: 0.6rem 0.8rem;
    background: var(--surface);
    border-radius: var(--radius);
}
.step-btn {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); cursor: pointer;
    display: grid; place-items: center;
}
.step-btn:hover { border-color: var(--text); }
.step-btn svg { width: 24px; height: 24px; fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
/* All step texts share one grid cell, so the bar is always as tall as the longest step
   and the diagram below never jumps when the step changes. */
.step-copy { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.step-copy > div { grid-area: 1 / 1; min-width: 0; }
.step-size-reference { visibility: hidden; pointer-events: none; }
.step-head { display: flex; align-items: baseline; gap: 0.8rem; flex-wrap: wrap; }
.step-num { font-weight: 700; font-size: 0.85rem; color: var(--rh-red-dark); }
.step-title { font-size: 1.3rem; }
.step-desc { font-size: 1rem; color: var(--text); max-width: 78rem; margin-top: 0.15rem; }
.step-facts { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
.step-facts:empty { display: none; }
.step-facts .hint { color: var(--rh-red-dark); font-weight: 700; }
.step-facts kbd { font-family: inherit; font-weight: 700; border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3rem; background: var(--bg); }
.step-btn.next { width: auto; padding: 0 1.1rem 0 1.3rem; border-radius: 999px; display: inline-flex; gap: 0.4rem; font-weight: 700; font-size: 1rem; }
.step-btn.next.primary { background: var(--text); border-color: var(--text); color: #fff; }
.step-btn.next.primary svg { stroke: #fff; }
.dots { flex: none; display: flex; gap: 0.15rem; }
.dot { width: 30px; height: 44px; border: none; background: none; cursor: pointer; display: grid; place-items: center; }
.dot::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
.dot.active::before { background: var(--rh-red); }
@media (max-width: 1400px) { .dots { display: none; } }

/* ---------- Diagram ---------- */
.stage { flex: 1; min-height: 0; padding: 0.4rem 1.4rem 0; display: flex; }
#arch { width: 100%; height: 100%; display: block; }
#arch text { font-family: 'Red Hat Text', system-ui, sans-serif; fill: var(--text); }
#arch .t-zone { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; font-size: 20px; }
#arch .t-group { font-size: 15px; fill: var(--text-muted); }
#arch .t-name { font-family: 'Red Hat Display', system-ui, sans-serif; font-weight: 700; font-size: 21px; }
#arch .t-sub { font-size: 16px; fill: var(--text-muted); }
#arch .t-strong { font-weight: 700; fill: var(--text); }
#arch .t-small { font-size: 15px; fill: var(--text-muted); }
#arch .t-badge { font-size: 12px; fill: var(--text-muted); }
#arch .t-flow { font-size: 15px; fill: var(--text-muted); }
#arch .t-human { fill: var(--human); }
#arch .t-ai { fill: var(--ai); }
#arch .badge { fill: #fff; stroke: #a3a3a3; stroke-width: 1; }
/* Live status: small filled dot = running in this game, hollow = not configured here. */
#arch .st-dot { fill: #fff; stroke: #a3a3a3; stroke-width: 1.5; }
#arch .st-dot.on { fill: #4d4d4d; stroke: #4d4d4d; }

.node { transition: opacity 0.35s; }
.node > rect.box { fill: #fff; stroke: var(--border); stroke-width: 1; transition: stroke 0.25s, stroke-width 0.25s; }
.focus .node { opacity: 0.4; }
.focus .node.active { opacity: 1; }
.node.active > rect.box { stroke: var(--rh-red); stroke-width: 2.5; }

.flow { fill: none; stroke: #a3a3a3; stroke-width: 1.5; transition: stroke 0.25s, opacity 0.35s; }
.flow.dashed { stroke-dasharray: 6 5; }
.focus .flow { opacity: 0.35; }
.flow.active { stroke: var(--rh-red-dark); stroke-width: 3.5; opacity: 1; stroke-dasharray: 12 8; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -40; } }
@media (prefers-reduced-motion: reduce) { .flow.active { animation: none; } }

/* ---------- Legend / footer ---------- */
.legend {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.6rem;
    padding: 0.45rem 1.4rem 0.6rem;
    font-size: 0.85rem; color: var(--text-muted);
}
.legend .k { display: inline-flex; align-items: center; gap: 0.45rem; }
.sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.sw-line { width: 26px; height: 0; border-top: 3px solid var(--rh-red-dark); }
.sw-dash { width: 26px; height: 0; border-top: 2px dashed #a3a3a3; }
.chip { border: 1px solid #a3a3a3; color: var(--text-muted); font-size: 0.7rem; padding: 0 0.35rem; border-radius: 4px; }
.sdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid #a3a3a3; background: #fff; }
.sdot.on { background: #4d4d4d; border-color: #4d4d4d; }
.legend .credit { margin-left: auto; font-size: 0.75rem; }

/* ---------- Tablet / smaller screens: give the diagram the height ---------- */
@media (max-width: 1400px), (max-height: 900px) {
    .app-header { padding: 0.35rem 1rem; }
    .brand img { height: 44px; }
    .brand h1 { font-size: 1.25rem; }
    .brand p { font-size: 0.8rem; }
    .hdr-btn { min-height: 44px; }
    .stepper { margin: 0.5rem 1rem 0; padding: 0.45rem 0.6rem; gap: 0.7rem; }
    .step-btn { width: 48px; height: 48px; }
    .step-title { font-size: 1.1rem; }
    .step-desc { font-size: 0.9rem; line-height: 1.35; }
    .step-facts { font-size: 0.8rem; margin-top: 0.15rem; }
    .step-btn.next { font-size: 0.9rem; padding: 0 0.9rem 0 1.1rem; }
    .stage { padding: 0.3rem 0.6rem 0; }
    .legend { padding: 0.3rem 1rem 0.45rem; gap: 0.3rem 1.1rem; font-size: 0.78rem; }
}

/* Auto tour feedback */
.stepper { position: relative; }
.auto-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; overflow: hidden; border-radius: 0 0 12px 12px; }
.auto-progress span { display: block; height: 100%; width: 0; background: var(--rh-red, #ee0000); }
.auto-progress.run span { animation: autofill var(--auto-ms, 12000ms) linear forwards; }
@keyframes autofill { from { width: 0; } to { width: 100%; } }
#btn-auto[aria-pressed="true"] { background: #151515; color: #fff; border-color: #151515; }
@media (prefers-reduced-motion: reduce) { .auto-progress.run span { animation: none; width: 100%; } }
</style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <a href="/" aria-label="Back to the game"><img src="/static/logo-light-compact.png" alt="Voice ID: AI or Alive?"></a>
        <div class="titles">
            <h1>How Voice ID works</h1>
            <p>Red Hat OpenShift and Red Hat OpenShift AI, on NVIDIA L4 GPUs and CPUs</p>
        </div>
    </div>
    <div class="header-actions">
        <button class="hdr-btn" id="btn-auto" type="button" aria-pressed="false" title="Advance automatically every 12 seconds">
            <svg viewBox="0 0 24 24"><polygon points="7,5 19,12 7,19" fill="currentColor" stroke="none"/></svg><span>Auto tour</span>
        </button>
        <a class="hdr-btn" href="/">
            <svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg><span>Back to game</span>
        </a>
    </div>
</header>

<section class="stepper" aria-live="polite">
    <button class="step-btn" id="btn-prev" type="button" aria-label="Previous step"><svg viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19"/></svg></button>
    <div class="step-copy" id="step-copy">
        <div id="step-active">
            <div class="step-head"><span class="step-num" id="step-num"></span><h2 class="step-title" id="step-title"></h2></div>
            <p class="step-desc" id="step-desc"></p>
            <p class="step-facts" id="step-facts"></p>
        </div>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Steps"></div>
    <button class="step-btn next" id="btn-next" type="button" aria-label="Next step"><span>Next</span><svg viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19"/></svg></button>
    <div class="auto-progress" id="auto-progress" aria-hidden="true"><span></span></div>
</section>

<main class="stage">
<svg id="arch" viewBox="0 0 1600 730" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice ID architecture diagram">
    <defs>
        <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="#a3a3a3"/>
        </marker>
        <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" fill="#a60000"/>
        </marker>
    </defs>

    <!-- ================= Areas: light tints, no heavy frames ================= -->
    <rect x="8" y="8" width="266" height="714" rx="16" fill="#f2f2f2"/>
    <text class="t-zone" x="24" y="44">At the booth</text>

    <rect x="290.5" y="8.5" width="1293" height="713" rx="16" fill="none" stroke="#c7c7c7" stroke-width="1"/>
    <rect x="310" y="27" width="4" height="21" fill="#ee0000"/>
    <text class="t-zone" x="322" y="44">Red Hat OpenShift</text>

    <rect x="650" y="60" width="914" height="276" rx="14" fill="#5e40be" fill-opacity="0.07"/>
    <text class="t-zone" x="670" y="92">AI opponents</text>
    <text class="t-small" x="808" y="92">battle mode only · answers pre-warmed in the background and cached</text>
    <image href="/static/icons/ai-inference.svg" x="670" y="108" width="20" height="20" opacity="0.8"/>
    <text class="t-group" x="696" y="124">Red Hat OpenShift AI · vLLM (GPU)</text>
    <text class="t-group" x="1130" y="124">Red Hat OpenShift AI · OpenVINO Model Server (CPU)</text>

    <rect x="650" y="372" width="474" height="278" rx="14" fill="#147878" fill-opacity="0.07"/>
    <text class="t-zone" x="670" y="404">Voice cloning engines</text>
    <text class="t-small" x="670" y="428">used by Clone Studio only</text>

    <rect x="1140.5" y="372.5" width="423" height="277" rx="14" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    <text class="t-zone" x="1160" y="404">Same person, real vs clone</text>
    <text class="t-small" x="1160" y="630">Both go into the game. Can you tell?</text>

    <!-- ================= Flows ================= -->
    <g id="flows">
        <path id="f-play"  class="flow" d="M250,98 H324" marker-end="url(#arr-g)"/>
        <path id="f-audio" class="flow dashed" d="M330,132 H256" marker-end="url(#arr-g)"/>
        <path id="f-tv"    class="flow" d="M250,242 H270 V158 H324" marker-end="url(#arr-g)"/>
        <path id="f-db"    class="flow" d="M470,182 V200" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
        <path id="f-teddy" class="flow" d="M610,110 H632 V286 H774 V224" marker-end="url(#arr-g)"/>
        <path id="f-iris"  class="flow" d="M610,110 H632 V286 H996 V224" marker-end="url(#arr-g)"/>
        <path id="f-adapter" class="flow" d="M610,110 H632 V286 H1124" marker-end="url(#arr-g)"/>
        <path id="f-gary"  class="flow" d="M1230,256 V224" marker-end="url(#arr-g)"/>
        <path id="f-gary2" class="flow" d="M1444,256 V224" marker-end="url(#arr-g)"/>
        <path id="f-prewarm" class="flow dashed" d="M610,80 H660" marker-end="url(#arr-g)"/>
        <path id="f-rec"   class="flow" d="M250,486 H324" marker-end="url(#arr-g)"/>
        <path id="f-studiodb" class="flow" d="M470,552 V574" marker-start="url(#arr-g)" marker-end="url(#arr-g)"/>
        <path id="f-xtts"  class="flow" d="M610,486 H664" marker-end="url(#arr-g)"/>
        <path id="f-fish"  class="flow" d="M610,526 H636 V610 H999 V534" marker-end="url(#arr-g)"/>
        <path id="f-clone" class="flow" d="M1104,486 H1132 V562 H1154" marker-end="url(#arr-g)"/>
        <path id="f-real"  class="flow dashed" d="M610,452 H630 V356 H1132 V470 H1154" marker-end="url(#arr-g)"/>
        <path id="f-import" class="flow dashed" d="M470,434 V294" marker-end="url(#arr-g)"/>
    </g>
    <text class="t-badge" x="614" y="99">pre-warm</text>
    <text class="t-flow" x="484" y="360">import tool</text>
    <text class="t-flow" x="484" y="380">or seed pack</text>

    <!-- ================= Nodes: title + one short line; details live in the step panel ================= -->
    <g id="nodes">
        <!-- Booth -->
        <g class="node" id="n-player">
            <rect class="box" x="20" y="70" width="230" height="92" rx="10"/>
            <image href="/static/icons/user.svg" x="36" y="84" width="32" height="32"/>
            <text class="t-name" x="78" y="108">Player</text>
            <text class="t-sub" x="36" y="144">Tablet browser</text>
        </g>
        <g class="node" id="n-tv">
            <rect class="box" x="20" y="196" width="230" height="92" rx="10"/>
            <image href="/static/icons/bar-graph.svg" x="36" y="210" width="32" height="32"/>
            <text class="t-name" x="78" y="234">Booth monitor</text>
            <text class="t-sub" x="36" y="270">Leaderboard at /tv</text>
        </g>
        <g class="node" id="n-speaker">
            <rect class="box" x="20" y="440" width="230" height="92" rx="10"/>
            <image href="/static/icons/user.svg" x="36" y="454" width="32" height="32"/>
            <text class="t-name" x="78" y="478">Speaker</text>
            <text class="t-sub" x="36" y="514">Records their voice</text>
        </g>

        <!-- Game -->
        <g class="node" id="n-game">
            <rect class="box" x="330" y="70" width="280" height="106" rx="10"/>
            <text class="t-name" x="348" y="106">Voice ID game</text>
            <rect class="badge" x="554.5" y="88.5" width="40" height="20" rx="4"/>
            <text class="t-badge" x="574.5" y="103" text-anchor="middle">CPU</text>
            <circle class="st-dot" id="dot-game" cx="354" cy="139" r="4.5"/>
            <text class="t-sub" id="st-game" x="366" y="145">checking…</text>
        </g>
        <g class="node" id="n-gamedb">
            <rect class="box" x="330" y="206" width="280" height="82" rx="10"/>
            <image href="/static/icons/storage.svg" x="346" y="220" width="30" height="30"/>
            <text class="t-name" x="386" y="244">Game database</text>
            <text class="t-sub" x="346" y="274">SQLite · clips, scores, answer cache</text>
        </g>

        <!-- Opponents -->
        <g class="node" id="n-teddy" data-opp="qwen">
            <rect class="box" x="670" y="134" width="208" height="84" rx="10"/>
            <circle class="st-dot" cx="690" cy="163" r="4.5"><title>checking…</title></circle>
            <text class="t-name" x="702" y="170">Teddy</text>
            <rect class="badge" x="804.5" y="153.5" width="58" height="20" rx="4"/>
            <text class="t-badge" x="833.5" y="168" text-anchor="middle">L4 GPU</text>
            <text class="t-sub" x="686" y="200">Qwen2-Audio-7B</text>
        </g>
        <g class="node" id="n-iris" data-opp="gemma">
            <rect class="box" x="892" y="134" width="208" height="84" rx="10"/>
            <circle class="st-dot" cx="912" cy="163" r="4.5"><title>checking…</title></circle>
            <text class="t-name" x="924" y="170">Iris</text>
            <!-- tiny spectrogram glyph: Iris is the only opponent that uses one -->
            <g transform="translate(968,155) scale(0.7)" fill="#5e40be">
                <rect x="0" y="14" width="5" height="8" opacity="0.35"/><rect x="7" y="8" width="5" height="14" opacity="0.6"/>
                <rect x="14" y="2" width="5" height="20"/><rect x="21" y="9" width="5" height="13" opacity="0.6"/>
                <rect x="28" y="5" width="5" height="17" opacity="0.8"/><rect x="35" y="13" width="5" height="9" opacity="0.35"/>
                <rect x="42" y="7" width="5" height="15" opacity="0.6"/>
            </g>
            <rect class="badge" x="1026.5" y="153.5" width="58" height="20" rx="4"/>
            <text class="t-badge" x="1055.5" y="168" text-anchor="middle">L4 GPU</text>
            <text class="t-sub" x="908" y="200">Gemma-4-12B</text>
        </g>
        <g class="node" id="n-gary" data-opp="gary-base">
            <rect class="box" x="1130" y="134" width="200" height="84" rx="10"/>
            <circle class="st-dot" cx="1150" cy="163" r="4.5"><title>checking…</title></circle>
            <text class="t-name" x="1162" y="170">Gary</text>
            <rect class="badge" x="1274.5" y="153.5" width="40" height="20" rx="4"/>
            <text class="t-badge" x="1294.5" y="168" text-anchor="middle">CPU</text>
            <text class="t-sub" x="1146" y="200">Wav2Vec2, base</text>
        </g>
        <g class="node" id="n-gary2" data-opp="gary-finetuned">
            <rect class="box" x="1344" y="134" width="200" height="84" rx="10"/>
            <circle class="st-dot" cx="1364" cy="163" r="4.5"><title>checking…</title></circle>
            <text class="t-name" x="1376" y="170">Gary 2.0</text>
            <rect class="badge" x="1488.5" y="153.5" width="40" height="20" rx="4"/>
            <text class="t-badge" x="1508.5" y="168" text-anchor="middle">CPU</text>
            <text class="t-sub" x="1360" y="200">Wav2Vec2, fine-tuned</text>
        </g>
        <!-- Adapter: one Deployment per Gary; turns the clip into the KServe v2 tensor OVMS expects -->
        <g class="node" id="n-adapter">
            <rect class="box" x="1130" y="262" width="414" height="50" rx="10"/>
            <text class="t-name" x="1150" y="294">Adapter</text>
            <text class="t-sub" x="1244" y="293">audio prep · KServe v2</text>
            <rect class="badge" x="1488.5" y="277.5" width="40" height="20" rx="4"/>
            <text class="t-badge" x="1508.5" y="292" text-anchor="middle">CPU</text>
        </g>

        <!-- Clone Studio -->
        <g class="node" id="n-studio">
            <rect class="box" x="330" y="440" width="280" height="106" rx="10"/>
            <text class="t-name" x="348" y="476">Voice Clone Studio</text>
            <rect class="badge" x="554.5" y="458.5" width="40" height="20" rx="4"/>
            <text class="t-badge" x="574.5" y="473" text-anchor="middle">CPU</text>
            <text class="t-sub" x="348" y="512">Record, clone, compare</text>
        </g>
        <g class="node" id="n-studiodb">
            <rect class="box" x="330" y="580" width="280" height="82" rx="10"/>
            <image href="/static/icons/storage.svg" x="346" y="594" width="30" height="30"/>
            <text class="t-name" x="386" y="618">Studio database</text>
            <text class="t-sub" x="346" y="648">SQLite · voices, clips</text>
        </g>

        <!-- Cloning engines -->
        <g class="node" id="n-xtts">
            <rect class="box" x="670" y="444" width="210" height="84" rx="10"/>
            <text class="t-name" x="686" y="480">XTTS v2</text>
            <rect class="badge" x="806.5" y="494.5" width="58" height="20" rx="4"/>
            <text class="t-badge" x="835.5" y="509" text-anchor="middle">L4 GPU</text>
            <text class="t-sub" x="686" y="510">Coqui</text>

        <g class="node" id="n-fish">
            <rect class="box" x="894" y="444" width="210" height="84" rx="10"/>

            <text class="t-sub" x="910" y="510">S2 Pro</text>

        <!-- Same person: real vs clone -->
        <g class="node" id="n-real">
            <rect class="box" x="1160" y="432" width="384" height="76" rx="10"/>
            <g transform="translate(1180,451) scale(0.86)" fill="#147878">
                <rect x="0" y="14" width="6" height="16" rx="3"/><rect x="10" y="6" width="6" height="32" rx="3"/>
                <rect x="20" y="0" width="6" height="44" rx="3"/><rect x="30" y="10" width="6" height="24" rx="3"/>
                <rect x="40" y="16" width="6" height="12" rx="3"/>
            </g>
            <text class="t-name t-human" x="1236" y="464">Real recording</text>
            <text class="t-sub" x="1236" y="490">The speaker reads a sentence</text>
        </g>
        <g class="node" id="n-clone">
            <rect class="box" x="1160" y="524" width="384" height="76" rx="10"/>
            <g transform="translate(1180,543) scale(0.86)" fill="#5e40be">
                <rect x="0" y="14" width="6" height="16" rx="1"/><rect x="10" y="6" width="6" height="32" rx="1"/>
                <rect x="20" y="0" width="6" height="44" rx="1"/><rect x="30" y="10" width="6" height="24" rx="1"/>
                <rect x="40" y="16" width="6" height="12" rx="1"/>
            </g>
            <text class="t-name t-ai" x="1236" y="556">AI clone</text>
            <text class="t-sub" x="1236" y="582">Same voice, same sentence</text>
        </g>

        <!-- GPU nodes -->
        <g class="node" id="n-gpu">
            <rect class="box" x="650" y="672" width="914" height="40" rx="10"/>
            <image href="/static/icons/gpu.svg" x="666" y="678" width="28" height="28"/>
            <text class="t-sub" x="704" y="698"><tspan class="t-strong">4 GPU nodes</tspan> · one NVIDIA L4 per GPU workload</text>
        </g>
    </g>
</svg>
</main>

<footer class="legend">
    <span class="k"><span class="sw" style="background:var(--human)"></span>Human voice</span>
    <span class="k"><span class="sw" style="background:var(--ai)"></span>AI voice</span>
    <span class="k"><span class="sw-line"></span>Active data flow</span>
    <span class="k"><span class="sw-dash"></span>Audio to player, or operator step</span>
    <span class="k"><span class="chip">L4 GPU</span><span class="chip">CPU</span>Where it runs</span>
    <span class="k" id="status-note"><span class="sdot on"></span>Running in this game <span class="sdot"></span>Not configured here</span>
    <span class="credit">Icons: Red Hat standard icons, CC BY 4.0</span>
</footer>

<script>
(function () {
    'use strict';

    // Each step highlights nodes (n-*) and flows (f-*). Facts: docs/ARCHITECTURE.md, infra/*/manifests.yaml.
    // `facts` are the technical details that used to crowd the diagram boxes; they show in the step panel.
    const STEPS = [
        {
            title: 'Voice ID at a glance',
            desc: 'Two small Flask apps and six model servers on one Red Hat OpenShift cluster. Follow a voice from a real person, through a clone, into the game and past the AI opponents.',
            hint: true,
            nodes: [], flows: []
        },
        {
            title: 'A player starts a game',
            desc: 'The player opens the game on a tablet. An OpenShift route passes the request to the Voice ID pod on ordinary CPU. The game itself needs no GPU.',
            facts: ['Flask + gunicorn', '1 pod', 'Route with edge TLS', 'game API, scoring, battle proxy'],
            nodes: ['n-player', 'n-game'], flows: ['f-play']
        },
        {
            title: 'Five clips from the game database',
            desc: 'The server picks five random clips, at least one AI and one human, and streams the audio to the tablet. The server decides what is right; the browser only adds up points.',
            facts: ['SQLite on a persistent volume', 'clips, players, leaderboard'],
            nodes: ['n-player', 'n-game', 'n-gamedb'], flows: ['f-db', 'f-audio']
        },
        {
            title: 'Battle: Teddy listens',
            desc: 'In battle mode the opponent judges every clip too. Teddy hears the raw audio with a forensic prompt. All answers are pre-computed in the background and cached, so a battle starts in about 1 s, and they stay sealed until the player answers.',
            facts: ['Qwen2-Audio-7B', 'vLLM as a KServe LLMInferenceService', 'Red Hat OpenShift AI', '1 × NVIDIA L4', 'answer cache in the game database'],
            nodes: ['n-game', 'n-gamedb', 'n-teddy'], flows: ['f-teddy', 'f-prewarm', 'f-db']
        },
        {
            title: 'Battle: Iris looks at a picture',
            desc: 'Iris never hears the clip: the backend draws a spectrogram image and Iris judges the picture. She is the only opponent that uses spectrograms.',
            facts: ['Gemma-4-12B, Red Hat AI FP8 build', 'vLLM', 'Red Hat OpenShift AI', '1 × NVIDIA L4'],
            nodes: ['n-game', 'n-iris'], flows: ['f-iris']
        },
        {
            title: 'Battle: Gary and Gary 2.0',
            desc: 'The Garys are deepfake classifiers: they score the waveform and return a fake probability. Gary 2.0 was fine-tuned on the voices in this game: about 90% balanced accuracy, and he rarely accuses a real human.',
            facts: ['adapter ×2, one per model: prepares 16 kHz audio, calls KServe v2', 'Wav2Vec2 base and V4-A fine-tune', 'OpenVINO Model Server on Red Hat OpenShift AI', 'CPU, no GPU'],
            nodes: ['n-game', 'n-adapter', 'n-gary', 'n-gary2'], flows: ['f-adapter', 'f-gary', 'f-gary2']
        },
        {
            title: 'Results on the booth monitor',
            desc: 'Every finished game lands on the leaderboard. The booth monitor shows /tv and asks the game API for the latest standings.',
            facts: ['/tv', 'refreshes every 10 s'],
            nodes: ['n-tv', 'n-game', 'n-gamedb'], flows: ['f-tv', 'f-db']
        },
        {
            title: 'A real person records',
            desc: 'Behind the scenes, a speaker reads short sentences in Czech, Slovak or English in Voice Clone Studio. These recordings become the human clips.',
            facts: ['Flask, separate app on CPU', 'SQLite on a persistent volume', 'voices, recordings, clips'],
            nodes: ['n-speaker', 'n-studio', 'n-studiodb', 'n-real'], flows: ['f-rec', 'f-studiodb', 'f-real']
        },
        {
            title: 'Cloning the same voice',
            desc: 'About 30 seconds of the speaker’s voice registers a clone at XTTS v2 and Fish Speech S2 Pro. Both then speak the same sentences in that voice. These become the AI clips.',
            facts: ['XTTS v2: Coqui streaming server', 'Fish Speech S2 Pro: torch.compile, highest quality', '1 × NVIDIA L4 each'],
            nodes: ['n-studio', 'n-xtts', 'n-fish', 'n-clone'], flows: ['f-xtts', 'f-fish', 'f-clone']
        },
        {
            title: 'Same person, real vs clone',
            desc: 'An operator imports the matching pairs into the game. The game never calls the voice engines live.',
            facts: ['import tool or private seed pack', 'voice data stays in the cluster databases: never in Git, an image or a public place'],
            nodes: ['n-studio', 'n-studiodb', 'n-gamedb', 'n-real', 'n-clone'], flows: ['f-import']
        },
        {
            title: 'The platform underneath',
            desc: 'Red Hat OpenShift runs everything. Red Hat OpenShift AI serves all four opponents through KServe: the two generative models with vLLM on GPUs, the two Garys with OpenVINO Model Server on regular CPU workers. One platform for both.',
            facts: ['4 × AWS g6.2xlarge', 'one NVIDIA L4 (24 GB) each', 'one whole GPU per workload', 'Garys and apps on CPU workers'],
            nodes: ['n-gpu', 'n-teddy', 'n-iris', 'n-gary', 'n-gary2', 'n-adapter', 'n-xtts', 'n-fish'], flows: []
        }
    ];

    function fillFacts(el, s) {
        el.textContent = '';
        if (s.hint) {
            el.innerHTML = '<span class="hint">Press <kbd>→</kbd> or click Next to walk through the ' + STEPS.length + ' steps</span> · or start the Auto tour';
            return;
        }
        el.textContent = (s.facts || []).join(' · ');
    }

    const svg = document.getElementById('arch');
    const flowsLayer = document.getElementById('flows');
    const allFlows = Array.from(document.querySelectorAll('.flow'));
    const allNodes = Array.from(document.querySelectorAll('.node'));
    const dots = document.getElementById('dots');
    let current = 0;
    let autoTimer = null;

    // Reserve height for the longest step text (invisible siblings in the same grid cell).
    const active = document.getElementById('step-active');
    STEPS.forEach((s, i) => {
        const ref = active.cloneNode(true);
        ref.removeAttribute('id');
        ref.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
        ref.classList.add('step-size-reference');
        ref.setAttribute('aria-hidden', 'true');
        ref.querySelector('.step-num').textContent = `Step ${i + 1} of ${STEPS.length}`;
        ref.querySelector('.step-title').textContent = s.title;
        ref.querySelector('.step-desc').textContent = s.desc;
        fillFacts(ref.querySelector('.step-facts'), s);
        document.getElementById('step-copy').appendChild(ref);

        const d = document.createElement('button');
        d.type = 'button';
        d.className = 'dot';
        d.setAttribute('role', 'tab');
        d.setAttribute('aria-label', `Step ${i + 1}: ${s.title}`);
        d.addEventListener('click', () => { go(i); restartAuto(); });
        dots.appendChild(d);
    });

    function render() {
        const s = STEPS[current];
        document.getElementById('step-num').textContent = `Step ${current + 1} of ${STEPS.length}`;
        document.getElementById('step-title').textContent = s.title;
        document.getElementById('step-desc').textContent = s.desc;
        fillFacts(document.getElementById('step-facts'), s);
        document.getElementById('btn-next').classList.toggle('primary', current === 0);
        Array.from(dots.children).forEach((d, i) => {
            d.classList.toggle('active', i === current);
            d.setAttribute('aria-selected', i === current ? 'true' : 'false');
        });

        const focus = s.nodes.length > 0 || s.flows.length > 0;
        svg.classList.toggle('focus', focus);
        const nodeSet = new Set(s.nodes);
        allNodes.forEach(n => n.classList.toggle('active', nodeSet.has(n.id)));
        const flowSet = new Set(s.flows);
        allFlows.forEach(f => {
            const on = flowSet.has(f.id);
            f.classList.toggle('active', on);
            const m = on ? 'url(#arr-r)' : 'url(#arr-g)';
            f.setAttribute('marker-end', m);
            if (f.hasAttribute('marker-start')) f.setAttribute('marker-start', m);
            // Shared bus segments: draw active flows last so they sit on top.
            if (on) flowsLayer.appendChild(f);
        });
    }

    function go(i) { current = (i + STEPS.length) % STEPS.length; render(); }
    function next() { go(current + 1); }
    function prev() { go(current - 1); }

    const AUTO_MS = 12000;
    function kickProgress() {
        const bar = document.getElementById('auto-progress');
        bar.style.setProperty('--auto-ms', AUTO_MS + 'ms');
        bar.classList.remove('run'); void bar.offsetWidth;   // restart the CSS animation
        if (autoTimer) bar.classList.add('run');
    }
    function autoTick() { next(); kickProgress(); }
    function setAuto(on, advanceNow) {
        const btn = document.getElementById('btn-auto');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.querySelector('span').textContent = on ? 'Stop tour' : 'Auto tour';
        btn.querySelector('svg').innerHTML = on
            ? '<rect x="6" y="5" width="4" height="14" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" fill="currentColor" stroke="none"/>'
            : '<polygon points="7,5 19,12 7,19" fill="currentColor" stroke="none"/>';
        clearInterval(autoTimer);
        autoTimer = on ? setInterval(autoTick, AUTO_MS) : null;
        if (on && advanceNow) next();          // visible reaction right away
        kickProgress();
    }
    function restartAuto() { if (autoTimer) setAuto(true, false); }

    document.getElementById('btn-next').addEventListener('click', () => { next(); restartAuto(); });
    document.getElementById('btn-prev').addEventListener('click', () => { prev(); restartAuto(); });
    document.getElementById('btn-auto').addEventListener('click', () => setAuto(!autoTimer, true));
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); restartAuto(); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); restartAuto(); }
    });

    // ---------- Live status (read-only endpoints the game already exposes) ----------
    // /api/battle/opponents lists the opponents configured in this deployment.
    function setOppStatus(list) {
        const ids = new Set((list || []).filter(o => o.available).map(o => o.id));
        document.querySelectorAll('[data-opp]').forEach(g => {
            const dot = g.querySelector('.st-dot');
            const on = ids.has(g.dataset.opp);
            dot.classList.toggle('on', on);
            dot.querySelector('title').textContent = on ? 'Running in this game' : 'Not configured here';
            g.classList.toggle('off', !on);
        });
    }
    function refreshStatus() {
        fetch('/api/battle/opponents', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(setOppStatus)
            .catch(() => document.querySelectorAll('[data-opp] .st-dot title').forEach(t => { t.textContent = 'Status unknown'; }));
        fetch('/api/leaderboard', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(d => {
                const n = d.total_players || 0;
                document.getElementById('st-game').textContent = `Live · ${n} player${n === 1 ? '' : 's'}`;
                document.getElementById('dot-game').classList.add('on');
            })
            .catch(() => { document.getElementById('st-game').textContent = 'Status unknown'; });
    }

    if (new URLSearchParams(location.search).get('auto') === '1') setAuto(true, false);
    const startStep = parseInt(new URLSearchParams(location.search).get('step') || '1', 10);
    go(Number.isFinite(startStep) ? startStep - 1 : 0);
    refreshStatus();
    setInterval(refreshStatus, 30000);
})();
</script>
</body>
