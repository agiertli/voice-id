image:
  repository: quay.io/agiertli/voice-id
  tag: "v3.5.2"
  pullPolicy: IfNotPresent

replicas: 1

clusterDomain: ""

conference:
  # Shown on registration, TV, admin. Set per event.
  name: "Jesenná ITAPA 2026 - Alpha"

game:
  size: 5
  prizeThreshold: 4
  defaultLang: "en"
  # Balance per game (human/AI split stays random): at least N AI clones of real people,
  # at most M other AI voices (XTTS stock + public-dataset voices).
  minCloneClips: 1
  maxOtherAiClips: 1

aiJudge:
  enabled: true
  # LLMInferenceService internal workload svc (no Connectivity Link needed; app uses verify=False)
  url: "https://gemma-kserve-workload-svc.voice-id.svc.cluster.local:8000/v1"
  model: "gemma-4-12b"

aiJudge2:
  enabled: true
  url: "https://qwen2-audio-kserve-workload-svc.voice-id.svc.cluster.local:8000/v1"
  model: "Qwen2-Audio-7B-Instruct"

detector:
  enabled: true
  url: "http://deepfake-detector-fine-tuned:8080"

detectorBase:
  enabled: true
  url: "http://deepfake-detector-base:8080"

# Which detector backend Gary / Gary 2.0 use:
#   openvino = DEFAULT, live since 2026-11-25. openvino.* below: serve.py-compatible adapters
#              (adapter-gary-*) in front of OpenShift AI's built-in OpenVINO Model Server, all in the
#              game's namespace (infra/openvino-detector/). Same API and verdicts, parity-tested.
#   legacy   = emergency rollback only: detector.url / detectorBase.url above, which needs the old
#              Flask + PyTorch Deployments re-applied first (infra/deepfake-detector*/, decommissioned).
# Rollback: helm upgrade ... --reuse-values --set detectorBackend=legacy. See docs/OPENVINO-SWITCH-BRIEF.md.
# Empty openvino URLs default to http://adapter-gary-*.<release namespace>.svc.cluster.local:8080.
detectorBackend: openvino
openvino:
  detectorUrl: "http://adapter-gary-finetuned.voice-id.svc.cluster.local:8080"
  detectorBaseUrl: "http://adapter-gary-base.voice-id.svc.cluster.local:8080"

# Opponent answer cache: each opponent's answer per clip is computed once (keyed by the
# clip audio sha256) and pre-warmed in the background, one request at a time per opponent,
# so "Preparing the game" is near-instant. Fallbacks (model failures) are never cached.
# Admin: GET /api/admin/opponent-cache/status, POST .../warm, POST .../clear.
opponentCache:
  enabled: true
  # seconds between background warm runs that pick up new/changed clips (min 30)
  warmIntervalSec: 600

# Admin page (/admin) password. Empty = image default. Override per event:
#   --set adminToken=...
adminToken: ""

storage: "1Gi"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "1Gi"
