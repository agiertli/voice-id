apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-id
  labels:
    app: voice-id
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: voice-id
  template:
    metadata:
      labels:
        app: voice-id
    spec:
      containers:
      - name: voice-id
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
        env:
        - name: DATA_DIR
          value: /app/data
        - name: GAME_SIZE
          value: "{{ .Values.game.size }}"
        - name: PRIZE_THRESHOLD
          value: "{{ .Values.game.prizeThreshold }}"
        - name: CONFERENCE_NAME
          value: "{{ .Values.conference.name }}"
        - name: DEFAULT_LANG
          value: "{{ .Values.game.defaultLang }}"
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        {{- if .Values.aiJudge.enabled }}
        - name: AI_JUDGE_URL
          value: "{{ .Values.aiJudge.url }}"
        - name: AI_JUDGE_MODEL
          value: "{{ .Values.aiJudge.model }}"
        {{- end }}
        {{- if .Values.aiJudge2.enabled }}
        - name: AI_JUDGE2_URL
          value: "{{ .Values.aiJudge2.url }}"
        - name: AI_JUDGE2_MODEL
          value: "{{ .Values.aiJudge2.model }}"
        {{- end }}
        - name: GAME_MIN_CLONE_CLIPS
          value: {{ .Values.game.minCloneClips | default 1 | quote }}
        - name: GAME_MAX_OTHER_AI_CLIPS
          value: {{ .Values.game.maxOtherAiClips | default 1 | quote }}
        - name: APP_VERSION
          value: {{ .Values.image.tag | quote }}
        {{- if .Values.adminToken }}
        - name: ADMIN_TOKEN
          value: {{ .Values.adminToken | quote }}
        {{- end }}
        {{- $backend := .Values.detectorBackend | default "legacy" }}
        {{- if not (has $backend (list "legacy" "openvino")) }}
        {{- fail (printf "detectorBackend must be 'legacy' or 'openvino', got %q" $backend) }}
        {{- end }}
        {{- $ov := .Values.openvino | default dict }}
        {{- if .Values.detector.enabled }}
        - name: DETECTOR_URL
          value: {{ (eq $backend "openvino" | ternary ($ov.detectorUrl | default "http://adapter-gary-finetuned.voice-id-ovms.svc.cluster.local:8080") .Values.detector.url) | quote }}
        {{- end }}
        {{- if .Values.detectorBase.enabled }}
        - name: DETECTOR_BASE_URL
          value: {{ (eq $backend "openvino" | ternary ($ov.detectorBaseUrl | default "http://adapter-gary-base.voice-id-ovms.svc.cluster.local:8080") .Values.detectorBase.url) | quote }}
        {{- end }}
        - name: DETECTOR_BACKEND
          value: {{ $backend | quote }}
        - name: OPPONENT_CACHE_ENABLED
          {{- $oc := .Values.opponentCache | default dict }}
          value: {{ (hasKey $oc "enabled" | ternary $oc.enabled true) | toString | quote }}
        - name: OPPONENT_CACHE_WARM_INTERVAL_SEC
          value: {{ (.Values.opponentCache).warmIntervalSec | default 600 | quote }}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/leaderboard
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/leaderboard
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: voice-id-data
      - name: config
        configMap:
          name: voice-id-config
