<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice ID — Leaderboard</title>
    <meta http-equiv="refresh" content="10">
    <style>
        :root {
            --bg-dark: #1a3a4a;
            --bg-darker: #132d3a;
            --bg-card: #1e4050;
            --cyan: #5de6c8;
            --cyan-dim: #3aaa8e;
            --magenta: #d94fa0;
            --light: #e8f4f0;
            --gray: #7a9baa;
            --green: #4ade80;
            --gold: #f0ab00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Red Hat Display', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--bg-darker);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(93,230,200,0.15);
        }

        .header img {
            max-height: 80px;
            width: auto;
        }

        .header .conf {
            font-size: 1.3rem;
            color: var(--cyan-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .board {
            flex: 1;
            padding: 1.5rem 3rem;
            display: flex;
            flex-direction: column;
        }

        .board-header {
            display: flex;
            padding: 0.8rem 1.5rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .col-rank { width: 80px; }
        .col-name { flex: 1; }
        .col-score { width: 120px; text-align: center; }
        .col-time { width: 120px; text-align: right; }

        .row {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(93,230,200,0.08);
            font-size: 1.3rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .row:nth-child(1) .col-rank { color: var(--gold); font-size: 1.8rem; }
        .row:nth-child(2) .col-rank { color: #C0C0C0; font-size: 1.6rem; }
        .row:nth-child(3) .col-rank { color: #CD7F32; font-size: 1.5rem; }

        .col-rank { font-weight: 900; }
        .col-name { font-weight: 600; }
        .col-score { font-weight: 800; color: var(--green); text-align: center; }
        .col-time { color: var(--gray); text-align: right; }

        .empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 1.8rem;
        }

        .footer {
            padding: 1rem 3rem;
            text-align: center;
            color: var(--cyan-dim);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <img src="/static/logo.jpg" alt="Voice ID: AI or Alive?">
        <div class="conf">{{ conference_name }}</div>
    </div>

    <div class="board" id="board">
        <div class="board-header">
            <span class="col-rank">Rank</span>
            <span class="col-name">Player</span>
            <span class="col-score">Score</span>
            <span class="col-time">Time</span>
        </div>
        <div id="rows"></div>
    </div>

    <div class="footer">Trust your ears. Unmask the machine.</div>

<script>
async function load() {
    try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const $rows = document.getElementById('rows');

        if (data.length === 0) {
            $rows.innerHTML = '<div class="empty">No scores yet — step up and play!</div>';
            return;
        }

        $rows.innerHTML = data.slice(0, 15).map((r, i) => `
            <div class="row">
                <span class="col-rank">#${i + 1}</span>
                <span class="col-name">${escHtml(r.player_name)}</span>
                <span class="col-score">${r.score}/${r.total}</span>
                <span class="col-time">${r.duration_sec ? r.duration_sec.toFixed(1) + 's' : ''}</span>
            </div>
        `).join('');
    } catch (e) {
        console.error(e);
    }
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

load();
</script>
</body>
</html>
