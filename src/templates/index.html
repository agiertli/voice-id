<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice ID: AI or Alive?</title>
    <style>
        :root {
            --bg: #17394a;
            --bg-deep: #0f2a38;
            --bg-card: #1c4456;
            --bg-card-border: rgba(93,230,200,0.1);
            --cyan: #5de6c8;
            --cyan-glow: rgba(93,230,200,0.25);
            --cyan-dim: #3aaa8e;
            --magenta: #d94fa0;
            --light: #e8f4f0;
            --muted: #8ab0c0;
            --green: #4ade80;
            --red-err: #f87171;
            --gold: #f0ab00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Red Hat Display', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(93,230,200,0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(217,79,160,0.04) 0%, transparent 50%);
        }

        .container {
            max-width: 660px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }

        /* --- Language Switcher --- */
        .lang-switcher {
            position: fixed;
            top: 0.8rem;
            right: 1rem;
            display: flex;
            gap: 0.4rem;
            z-index: 200;
        }
        .lang-btn {
            width: 36px;
            height: 26px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 22px;
            text-align: center;
            background: var(--bg-deep);
            transition: all 0.15s;
            padding: 0;
        }
        .lang-btn.active { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
        .lang-btn:hover { border-color: var(--cyan-dim); }

        /* --- Registration --- */
        #screen-register { text-align: center; }

        .hero-logo {
            width: 100%;
            max-width: 480px;
            margin: 0.5rem auto 0;
            display: block;
            border-radius: 14px;
        }

        .event-badge {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.3rem 1.2rem;
            background: var(--bg-deep);
            border: 1px solid var(--bg-card-border);
            border-radius: 100px;
            color: var(--cyan-dim);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-prompt {
            margin-top: 1rem;
            font-size: 1.05rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .name-input {
            margin-top: 1rem;
            background: var(--bg-deep);
            border: 2px solid rgba(93,230,200,0.2);
            color: var(--light);
            font-size: 1.2rem;
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        .name-input:focus { border-color: var(--cyan); }
        .name-input::placeholder { color: var(--muted); opacity: 0.5; }

        .btn {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--cyan);
            color: var(--bg-deep);
            margin-top: 1rem;
        }
        .btn-primary:hover { background: #4dd4b4; }
        .btn-primary:disabled {
            background: #1e4050;
            color: #456;
            cursor: not-allowed;
        }

        .rules-box {
            margin-top: 1rem;
            text-align: left;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--bg-card-border);
        }
        .rules-box h3 { color: var(--cyan); font-size: 0.85rem; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 1px; }
        .rules-box li { margin: 0.2rem 0 0.2rem 1.2rem; color: #a8ced8; line-height: 1.4; font-size: 0.88rem; }

        /* --- Game --- */
        #screen-game { display: none; }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .game-logo {
            height: 36px;
            opacity: 0.6;
        }

        .progress-bar {
            display: flex;
            gap: 0.4rem;
        }

        .progress-dot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
            border: 2.5px solid transparent;
            color: #456;
        }
        .progress-dot.active { border-color: var(--cyan); color: var(--cyan); }
        .progress-dot.correct { background: #164a32; border-color: var(--green); color: var(--green); }
        .progress-dot.wrong { background: #4a1828; border-color: var(--red-err); color: var(--red-err); }

        .clip-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid var(--bg-card-border);
            text-align: center;
            transition: border-color 0.4s;
        }
        .clip-card.reveal-correct { border-color: var(--green); }
        .clip-card.reveal-wrong { border-color: var(--red-err); }

        .clip-meta {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
        }

        /* --- Identity Icon --- */
        .identity-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 0.8rem;
            position: relative;
        }
        .identity-icon img,
        .identity-icon .icon-svg-wrap {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s, transform 0.4s;
            border-radius: 12px;
        }
        .identity-icon .icon-mystery { opacity: 1; fill: var(--muted); }
        .identity-icon .icon-reveal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transform: scale(0.7);
        }
        .identity-icon .icon-reveal img,
        .identity-icon .icon-reveal .icon-svg-wrap {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .identity-icon.revealed .icon-mystery { opacity: 0; transform: scale(0.7); }
        .identity-icon.revealed .icon-reveal { opacity: 1; transform: scale(1); }

        .waveform {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
            margin: 0.8rem 0;
        }
        .waveform .bar {
            width: 3.5px;
            border-radius: 2px;
            transition: height 0.08s;
            min-height: 3px;
        }
        .waveform .bar:nth-child(odd) { background: var(--cyan); }
        .waveform .bar:nth-child(even) { background: var(--magenta); }

        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--cyan);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            transition: all 0.15s;
        }
        .play-btn:hover { box-shadow: 0 0 24px var(--cyan-glow); }
        .play-btn svg { width: 26px; height: 26px; fill: var(--bg-deep); margin-left: 3px; }
        .play-btn.playing svg { margin-left: 0; }
        .play-btn.loading { opacity: 0.5; animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(0.9)} }

        .choice-buttons { display: flex; gap: 0.8rem; transition: opacity 0.3s; }

        .choice-btn {
            flex: 1;
            padding: 1rem;
            border: 2.5px solid;
            border-radius: 12px;
            background: transparent;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .choice-btn:active { transform: scale(0.97); }

        .choice-btn.ai { border-color: var(--magenta); color: var(--magenta); }
        .choice-btn.ai:hover { background: rgba(217,79,160,0.1); }
        .choice-btn.human { border-color: var(--cyan); color: var(--cyan); }
        .choice-btn.human:hover { background: rgba(93,230,200,0.1); }

        .choice-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .choice-btn.selected.ai { background: var(--magenta); color: #fff; }
        .choice-btn.selected.human { background: var(--cyan); color: var(--bg-deep); }

        /* --- In-Screen Reveal --- */
        .reveal-section {
            display: none;
            text-align: center;
            animation: fadeUp 0.4s ease;
        }
        .reveal-section.show { display: block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .reveal-result {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0.8rem 0 0.4rem;
        }
        .reveal-result.correct { color: var(--green); }
        .reveal-result.wrong { color: var(--red-err); }

        .reveal-detail {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 0.15rem;
        }
        .reveal-detail strong { color: var(--light); }

        .reveal-next {
            margin-top: 1rem;
            background: var(--cyan);
            color: var(--bg-deep);
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .reveal-next:hover { background: #4dd4b4; }

        /* --- Results --- */
        #screen-results { display: none; text-align: center; padding-top: 1.5rem; }

        .results-logo {
            width: 240px;
            margin: 0 auto 1rem;
            display: block;
            border-radius: 10px;
            opacity: 0.7;
        }

        .results-score {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--cyan);
        }
        .results-score .of { font-size: 1.8rem; color: var(--muted); font-weight: 400; }

        .results-label { font-size: 1.1rem; color: var(--muted); margin: 0.4rem 0 1.2rem; }

        .prize-banner {
            background: linear-gradient(135deg, var(--cyan-dim), var(--magenta));
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .no-prize {
            background: var(--bg-card);
            color: var(--muted);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--bg-card-border);
        }

        .btn-play-again { margin-top: 1rem; }

        /* --- Loading Screen --- */
        #screen-loading {
            display: none;
            text-align: center;
            padding-top: 4rem;
        }

        .loading-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 2rem;
        }

        .loading-bar-track {
            width: 100%;
            max-width: 360px;
            height: 12px;
            background: var(--bg-deep);
            border-radius: 6px;
            margin: 0 auto 1rem;
            overflow: hidden;
            border: 1px solid var(--bg-card-border);
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .loading-percent {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--cyan);
            font-variant-numeric: tabular-nums;
        }

        .loading-detail {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }

        @media (max-width: 500px) {
            .hero-logo { max-width: 100%; }
            .container { padding: 1rem; }
            .choice-buttons { flex-direction: column; }
            .progress-dot { width: 36px; height: 36px; font-size: 0.85rem; }
            .clip-card { padding: 1.2rem; }
            .identity-icon { width: 80px; height: 80px; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Language Switcher -->
<div class="lang-switcher" id="lang-switcher">
    <button class="lang-btn" data-lang="en" title="English">&#127468;&#127463;</button>
    <button class="lang-btn" data-lang="cs" title="Cestina">&#127464;&#127487;</button>
    <button class="lang-btn" data-lang="sk" title="Slovencina">&#127480;&#127472;</button>
</div>

<div class="container">
    <!-- ========== Registration ========== -->
    <div id="screen-register">
        <img src="/static/logo.jpg" alt="Voice ID: AI or Alive?" class="hero-logo">
        <div class="event-badge">{{ conference_name }}</div>

        <p class="hero-prompt">
            <span data-i18n="listen_prompt"></span><br>
            <span data-i18n="can_you_tell"></span>
        </p>

        <input type="text" class="name-input" id="player-name" data-i18n-placeholder="enter_name" maxlength="40" autocomplete="off">
        <br>
        <button class="btn btn-primary" id="btn-start" disabled data-i18n="start_game"></button>

        <div class="rules-box">
            <h3 data-i18n="how_it_works"></h3>
            <ul>
                <li data-i18n="rule_clips"></li>
                <li id="rule-choose"></li>
                <li data-i18n="rule_reveal"></li>
                <li data-i18n="rule_prize"></li>
            </ul>
        </div>
    </div>

    <!-- ========== Loading ========== -->
    <div id="screen-loading">
        <img src="/static/logo.jpg" alt="" class="hero-logo" style="max-width:320px; opacity:0.7">
        <div class="loading-title" data-i18n="preparing_game"></div>
        <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-percent" id="loading-percent">0%</div>
        <div class="loading-detail" id="loading-detail"></div>
    </div>

    <!-- ========== Game ========== -->
    <div id="screen-game">
        <div class="game-header">
            <img src="/static/logo.jpg" alt="" class="game-logo">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="clip-card" id="clip-card">
            <div class="clip-meta" id="clip-meta"></div>

            <!-- Mystery silhouette icon -->
            <div class="identity-icon" id="identity-icon">
                <img class="icon-mystery" src="/static/mysterious.svg" alt="?">
                <div class="icon-reveal icon-human" style="display:none">
                    <img src="/static/real-person.svg" alt="Human">
                </div>
                <div class="icon-reveal icon-ai" style="display:none">
                    <div class="icon-svg-wrap"><img src="/static/robot.svg" alt="AI" style="filter: brightness(0) saturate(100%) invert(42%) sepia(63%) saturate(1500%) hue-rotate(300deg) brightness(92%) contrast(95%)"></div>
                </div>
            </div>

            <div class="waveform" id="waveform"></div>

            <button class="play-btn" id="play-btn">
                <svg viewBox="0 0 24 24" id="play-icon"><polygon points="5,3 19,12 5,21"/></svg>
            </button>

            <div class="choice-buttons" id="choice-buttons">
                <button class="choice-btn ai" id="btn-ai" disabled data-i18n="ai_generated"></button>
                <button class="choice-btn human" id="btn-human" disabled data-i18n="natural_voice"></button>
            </div>

            <!-- In-screen reveal (hidden until answer) -->
            <div class="reveal-section" id="reveal-section">
                <div class="reveal-result" id="reveal-result"></div>
                <div class="reveal-detail" id="reveal-source"></div>
                <div class="reveal-detail" id="reveal-speaker"></div>
                <button class="reveal-next" id="reveal-next" data-i18n="next_clip"></button>
            </div>
        </div>
        <audio id="audio-player" preload="auto"></audio>
    </div>

    <!-- ========== Results ========== -->
    <div id="screen-results">
        <img src="/static/logo.jpg" alt="" class="results-logo">
        <div class="results-score">
            <span id="final-score">0</span><span class="of">/{{ game_size }}</span>
        </div>
        <div class="results-label" data-i18n="correct_guesses"></div>
        <div id="prize-section"></div>
        <button class="btn btn-primary btn-play-again" id="btn-play-again" data-i18n="play_again"></button>
    </div>
</div>

<script>
const GAME_SIZE = {{ game_size }};
const PRIZE_THRESHOLD = {{ prize_threshold }};
const DEFAULT_LANG = '{{ default_lang }}';
const CLONE_SPEAKERS = ['anton', 'miska'];

let i18nData = {};
let currentLang = localStorage.getItem('voiceid-lang') || DEFAULT_LANG;
let gameState = { gameId: null, clips: [], currentIndex: 0, results: [] };

const $ = id => document.getElementById(id);
const $register = $('screen-register'), $game = $('screen-game'), $results = $('screen-results'), $loading = $('screen-loading');
const $nameInput = $('player-name'), $startBtn = $('btn-start');
const $playBtn = $('play-btn'), $audio = $('audio-player');
const $waveform = $('waveform');
const $btnAi = $('btn-ai'), $btnHuman = $('btn-human');
const $clipCard = $('clip-card');
const $choiceButtons = $('choice-buttons');
const $revealSection = $('reveal-section');
const $identityIcon = $('identity-icon');

// --- i18n ---
async function loadI18n() {
    try {
        const res = await fetch('/api/i18n');
        i18nData = await res.json();
    } catch(e) {
        i18nData = {};
    }
    applyI18n();
}

function t(key) {
    const strings = i18nData[currentLang] || i18nData['en'] || {};
    let val = strings[key] || key;
    val = val.replace('{game_size}', GAME_SIZE);
    val = val.replace('{prize_threshold}', PRIZE_THRESHOLD);
    return val;
}

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    // Special: rule_choose with colored spans
    const rc = $('rule-choose');
    if (rc) {
        rc.innerHTML = t('rule_choose_pre')
            + '<strong style="color:var(--magenta)">' + t('ai_generated') + '</strong>'
            + t('rule_choose_or')
            + '<strong style="color:var(--cyan)">' + t('natural_voice') + '</strong>';
    }
    // Update lang buttons active state
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
}

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('voiceid-lang', lang);
    applyI18n();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

// --- Waveform ---
const NUM_BARS = 44;
for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement('div');
    b.className = 'bar'; b.style.height = '3px';
    $waveform.appendChild(b);
}
const bars = $waveform.querySelectorAll('.bar');

let audioCtx, analyser, source, animFrame;
let audioLoaded = false;
const preloadCache = {};
const preloadPromises = {};

function preloadClipWithProgress(id, onBytes) {
    if (preloadPromises[id]) return preloadPromises[id];
    preloadPromises[id] = fetch('/api/clip/' + id + '/audio').then(async r => {
        const contentLength = +r.headers.get('Content-Length') || 0;
        if (!r.body || !contentLength) {
            const blob = await r.blob();
            if (onBytes) onBytes(id, blob.size, blob.size);
            preloadCache[id] = URL.createObjectURL(blob);
            return id;
        }
        const reader = r.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            if (onBytes) onBytes(id, received, contentLength);
        }
        const blob = new Blob(chunks);
        preloadCache[id] = URL.createObjectURL(blob);
        return id;
    });
    return preloadPromises[id];
}

function preloadClip(id) {
    return preloadClipWithProgress(id, null);
}

async function preloadAllClips(clips, onProgress) {
    const sizes = {};
    const loaded = {};
    clips.forEach(c => { sizes[c.id] = 0; loaded[c.id] = 0; });

    function reportProgress(id, received, total) {
        sizes[id] = total;
        loaded[id] = received;
        const totalBytes = Object.values(sizes).reduce((a, b) => a + b, 0);
        const loadedBytes = Object.values(loaded).reduce((a, b) => a + b, 0);
        if (totalBytes > 0 && onProgress) {
            onProgress(loadedBytes, totalBytes);
        }
    }

    await Promise.all(clips.map(c => preloadClipWithProgress(c.id, reportProgress)));
}

function initAudioAnalyser() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
    source = audioCtx.createMediaElementSource($audio);
    source.connect(analyser); analyser.connect(audioCtx.destination);
}

function animateWaveform() {
    if (!analyser) return;
    const d = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(d);
    const step = Math.floor(d.length / NUM_BARS);
    bars.forEach((bar, i) => { bar.style.height = Math.max(3, (d[i*step]||0)/255*65) + 'px'; });
    animFrame = requestAnimationFrame(animateWaveform);
}
function stopWaveform() { cancelAnimationFrame(animFrame); bars.forEach(b => b.style.height = '3px'); }

$audio.addEventListener('canplaythrough', () => { audioLoaded = true; $playBtn.classList.remove('loading'); });
$audio.addEventListener('ended', () => { updatePlayIcon(false); stopWaveform(); });

// --- Game Flow ---
$nameInput.addEventListener('input', () => { $startBtn.disabled = !$nameInput.value.trim(); });
$nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !$startBtn.disabled) $startBtn.click(); });

$startBtn.addEventListener('click', async () => {
    const name = $nameInput.value.trim();
    if (!name) return;
    $startBtn.disabled = true; $startBtn.textContent = t('loading');
    try {
        const res = await fetch('/api/game/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({player_name:name}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        gameState = { gameId: data.game_id, clips: data.clips, currentIndex: 0, results: [] };

        showScreen('loading');
        const $fill = $('loading-bar-fill');
        const $pct = $('loading-percent');
        const $detail = $('loading-detail');
        $fill.style.width = '0%';
        $pct.textContent = '0%';
        $detail.textContent = t('loading_clip').replace('{n}', '0').replace('{total}', String(data.clips.length));

        await preloadAllClips(data.clips, (loadedBytes, totalBytes) => {
            const pct = Math.min(100, Math.round((loadedBytes / totalBytes) * 100));
            $fill.style.width = pct + '%';
            $pct.textContent = pct + '%';
        });

        showScreen('game'); loadClip(0);
    } catch(e) { alert('Error: '+e.message); $startBtn.disabled=false; $startBtn.textContent=t('start_game'); }
});

function showScreen(s) {
    $register.style.display = s==='register' ? 'block' : 'none';
    $loading.style.display = s==='loading' ? 'block' : 'none';
    $game.style.display = s==='game' ? 'block' : 'none';
    $results.style.display = s==='results' ? 'block' : 'none';
}

function buildProgressBar() {
    const pb = $('progress-bar'); pb.innerHTML = '';
    for (let i = 0; i < GAME_SIZE; i++) {
        const d = document.createElement('div');
        d.className = 'progress-dot' + (i===gameState.currentIndex?' active':'');
        d.textContent = i+1;
        if (gameState.results[i] !== undefined) { d.classList.add(gameState.results[i]?'correct':'wrong'); d.classList.remove('active'); }
        pb.appendChild(d);
    }
}

function resetIdentityIcon() {
    $identityIcon.classList.remove('revealed');
    $identityIcon.querySelector('.icon-mystery').style.display = '';
    $identityIcon.querySelector('.icon-human').style.display = 'none';
    $identityIcon.querySelector('.icon-ai').style.display = 'none';
}

function revealIdentityIcon(isAi) {
    $identityIcon.querySelector('.icon-mystery').style.display = '';
    $identityIcon.querySelector('.icon-human').style.display = 'none';
    $identityIcon.querySelector('.icon-ai').style.display = 'none';
    $identityIcon.querySelector(isAi ? '.icon-ai' : '.icon-human').style.display = '';
    $identityIcon.classList.add('revealed');
}

function loadClip(idx) {
    const clip = gameState.clips[idx];
    buildProgressBar();
    $('clip-meta').textContent = t('clip_of').replace('{current}', idx+1).replace('{total}', GAME_SIZE);
    audioLoaded = false;
    $audio.src = preloadCache[clip.id] || ('/api/clip/'+clip.id+'/audio');
    $audio.load();

    // Reset card state
    $clipCard.className = 'clip-card';
    $choiceButtons.style.display = 'flex';
    $revealSection.classList.remove('show');
    $playBtn.style.display = 'flex';
    $waveform.style.display = 'flex';
    resetIdentityIcon();

    $btnAi.disabled = false; $btnHuman.disabled = false;
    $btnAi.classList.remove('selected'); $btnHuman.classList.remove('selected');
    $btnAi.textContent = t('ai_generated'); $btnHuman.textContent = t('natural_voice');
    stopWaveform(); updatePlayIcon(false);
}

$playBtn.addEventListener('click', () => {
    initAudioAnalyser();
    if ($audio.paused) {
        if (!audioLoaded) {
            $playBtn.classList.add('loading');
            $audio.addEventListener('canplaythrough', function once() { $audio.removeEventListener('canplaythrough',once); $playBtn.classList.remove('loading'); $audio.play(); updatePlayIcon(true); animateWaveform(); });
            $audio.load(); return;
        }
        $audio.play(); updatePlayIcon(true); animateWaveform();
    } else { $audio.pause(); updatePlayIcon(false); stopWaveform(); }
});

function updatePlayIcon(playing) {
    const ic = $('play-icon'); $playBtn.classList.toggle('playing', playing);
    ic.innerHTML = playing ? '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>' : '<polygon points="5,3 19,12 5,21"/>';
}

async function submitGuess(guess) {
    $btnAi.disabled=true; $btnHuman.disabled=true;
    (guess==='ai'?$btnAi:$btnHuman).classList.add('selected');
    $audio.pause(); stopWaveform(); updatePlayIcon(false);
    const clip = gameState.clips[gameState.currentIndex];
    try {
        const res = await fetch(`/api/game/${gameState.gameId}/guess`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({clip_id:clip.id, guess}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        gameState.results.push(data.correct); buildProgressBar(); showInScreenReveal(data);
    } catch(e) { alert('Error: '+e.message); $btnAi.disabled=false; $btnHuman.disabled=false; }
}

$btnAi.addEventListener('click', () => submitGuess('ai'));
$btnHuman.addEventListener('click', () => submitGuess('human'));

function showInScreenReveal(data) {
    const isAi = data.actual === 'ai';

    // Card border
    $clipCard.classList.add(data.correct ? 'reveal-correct' : 'reveal-wrong');

    // Reveal identity icon
    revealIdentityIcon(isAi);

    // Hide play button and choice buttons, show reveal section
    $playBtn.style.display = 'none';
    $waveform.style.display = 'none';
    setTimeout(() => {
        $choiceButtons.style.display = 'none';

        // Result text
        const $result = $('reveal-result');
        $result.textContent = data.correct ? t('correct') : t('wrong');
        $result.className = 'reveal-result ' + (data.correct ? 'correct' : 'wrong');

        // Source info
        if (isAi) {
            $('reveal-source').innerHTML = '<strong style="color:var(--magenta)">' + t('was_ai') + '</strong>';
            let info = data.source || 'unknown';
            if (data.speaker && CLONE_SPEAKERS.includes(data.speaker.toLowerCase())) {
                info += ' (' + t('clone_suffix').replace('{speaker}', data.speaker) + ')';
            } else if (data.speaker) {
                info += ' (' + t('voice_suffix').replace('{speaker}', data.speaker) + ')';
            }
            $('reveal-speaker').innerHTML = t('model_label') + ' <strong>' + info + '</strong>';
        } else {
            $('reveal-source').innerHTML = '<strong style="color:var(--cyan)">' + t('was_human') + '</strong>';
            $('reveal-speaker').innerHTML = t('speaker_label') + ' <strong>' + (data.speaker || 'unknown') + '</strong>';
        }

        $('reveal-next').textContent = gameState.currentIndex >= GAME_SIZE-1 ? t('see_results') : t('next_clip');
        $revealSection.classList.add('show');
    }, 300);
}

$('reveal-next').addEventListener('click', () => {
    if (++gameState.currentIndex >= GAME_SIZE) completeGame(); else loadClip(gameState.currentIndex);
});

async function completeGame() {
    try {
        const res = await fetch(`/api/game/${gameState.gameId}/complete`, {method:'POST'});
        const data = await res.json(); if (!res.ok) throw new Error(data.error);
        $('final-score').textContent = data.score;
        $('prize-section').innerHTML = data.prize
            ? '<div class="prize-banner">' + t('prize_won') + '</div>'
            : '<div class="no-prize">' + t('no_prize') + '</div>';
        showScreen('results');
    } catch(e) { alert('Error: '+e.message); }
}

$('btn-play-again').addEventListener('click', () => {
    $nameInput.value=''; $startBtn.disabled=true; $startBtn.textContent=t('start_game'); showScreen('register');
});

// --- Init ---
loadI18n();
</script>
</body>
</html>
